name: Differential merge tests

# Runs the full differential corpus: git lane vs Sharp lane on every
# scenario. Sharp lane is currently a stub returning `error`, so this
# workflow is expected to be RED until Sharp ships. A scenario flipping
# from PASS -> FAIL is a hard regression; FAIL -> PASS is celebrated in
# the workflow summary.

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - '**/*.md'
      - .agents/**
      - .claude/**
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/**
      - '**/*.md'
      - .agents/**
      - .claude/**
  workflow_dispatch:
  workflow_call:

concurrency:
  group: test-differential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  differential:
    if: github.event.pull_request.draft != true
    needs: []
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run differential corpus
        env:
          SHARP_TEST_REQUIRE_PG: '1'
        run: |
          bun tests/harness/run.ts --json differential-report.json || true
          # Always exit 0 here — the runner exit code is captured in the JSON
          # report. The Differential gate step below fails the job based on
          # delta-vs-main rather than absolute pass/fail (since v1 is RED by
          # construction until Sharp is implemented).
      - name: Upload differential report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-report-${{ github.run_id }}
          path: differential-report.json
          retention-days: 30
      - name: Differential gate (no PASS->FAIL regressions)
        # TODO(post-v1): compare differential-report.json against the
        # main branch's most recent artifact and fail if any scenario
        # regressed from PASS to FAIL. Until Sharp is implemented every
        # scenario is FAIL by construction so the gate is a no-op.
        run: |
          test -f differential-report.json
          jq -e '.scenarios | length > 0' differential-report.json
