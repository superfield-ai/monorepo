name: Meta PG container harness

# Sanity-checks Sharp's Postgres deployment path before higher-level suites
# rely on it. Spawns a postgres:16 container via the same TS helper Sharp
# uses in production tests; if this fails, the differential run's Sharp lane
# is guaranteed to be broken — fail fast and visibly here instead.

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - '**/*.md'
      - .agents/**
      - .claude/**
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/**
      - '**/*.md'
      - .agents/**
      - .claude/**
  workflow_dispatch:
  workflow_call:

concurrency:
  group: meta-pg-container-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Postgres canary
        env:
          SHARP_TEST_REQUIRE_PG: '1'
        run: bun --bun vitest run tests/harness/postgres.test.ts
