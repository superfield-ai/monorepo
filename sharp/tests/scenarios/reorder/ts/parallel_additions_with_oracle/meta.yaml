name: parallel_additions_with_oracle
category: reorder
language: ts
summary: >
  Both branches add a new exported helper at the end of the same file.
  branch_c/ serves as the Tier 2 oracle: it has incorporated function b()
  from branch_a, signalling that branch_a's addition is the "correct" one
  from a downstream-compatibility perspective. Sharp's concat-additions
  heuristic handles this cleanly regardless; the oracle branch documents
  the intended selection for future multi-candidate scenarios.
expected_git_outcome: conflict
expected_sharp_outcome: clean_ok
validator: ts
notes: |
  With current Tier 1 (concat-additions handles both pure additions), this
  scenario resolves to clean_ok regardless of the oracle. The oracle branch
  (branch_c/) is present to exercise the Tier 2 oracle infrastructure and
  to document which candidate would be preferred if Tier 1 ever produced
  multiple candidates for this pattern.
