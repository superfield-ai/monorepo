name: parallel_enum_additions
category: reorder
language: ts
summary: >
  Both branches add a new variant to the same TypeScript enum. Git reports
  a conflict because both additions anchor to the same last variant. Sharp
  should resolve cleanly via concat-additions.
expected_git_outcome: conflict
expected_sharp_outcome: clean_ok
validator: ts
notes: |
  Classic adjacent-insertion false conflict applied to TypeScript enum
  variants. Both developers independently extend the enum with a new value;
  git's hunk algorithm collapses both insertions into a single conflict
  region. Sharp concatenates both additions for a clean_ok merge.
