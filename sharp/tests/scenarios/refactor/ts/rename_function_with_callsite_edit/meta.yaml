name: rename_function_with_callsite_edit
category: refactor
language: ts
summary: >
  Branch A renames computeTotal() to computeOrderTotal(); branch B edits
  the body of a call site that still uses the old name. git merges
  textually and produces a tree that no longer typechecks: the call site
  still invokes computeTotal() which no longer exists. The expected Sharp
  outcome is clean_ok with the rename propagated through to the edited
  call site.
expected_git_outcome: clean_wrong
expected_sharp_outcome: clean_ok
validator: ts
notes: |
  Canonical "semantic merge" scenario from docs/test-plan.md. Pure-text
  three-way merge has no way to know that the call site needs to be
  rewritten alongside the declaration.
