name: whitespace_vs_edit
category: whitespace_only
language: ts
summary: >
  Branch A's only change is whitespace (re-indenting a function body).
  Branch B edits a value inside the same function. git treats the diffs
  as overlapping and reports a conflict despite there being zero semantic
  disagreement.
expected_git_outcome: conflict
expected_sharp_outcome: clean_ok
validator: ts
