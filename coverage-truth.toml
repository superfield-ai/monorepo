# coverage-truth.toml — executed-coverage truth table
#
# STATUS: populated + enforced (issue #759, built on the #769 dev-scout skeleton).
# scripts/check-coverage-truth.sh validates every row in this file against what
# CI actually compiles, migrates, and EXECUTES. A green CI check only proves a
# unit *compiled*; this manifest is the machine-checkable record of what truly
# *runs*, so the embedder's zero-executed gap stays visible and regression-guarded.
#
# Canonical docs: docs/prd.md, docs/adr-embedding-model.md
#
# ── Schema ────────────────────────────────────────────────────────────────────
# Top-level [meta] table:
#   schema_version : integer  — bump on any breaking field change.
#   generated_by   : string   — the tool/script that owns regeneration.
#
# One [[unit]] array-of-tables entry per directory under crates/* and packages/*.
# Required fields on every [[unit]] row (check-coverage-truth.sh asserts presence,
# type, AND value against reality):
#
#   path                 : string  — repo-relative dir, e.g. "crates/nexum" or
#                                     "packages/db". Primary key; unique; on disk.
#   kind                 : string  — "crate" | "package". Derived from path[0].
#   compiled_in_ci       : bool    — true if a CI workflow compiles this unit.
#                                     Crates: rust.yml `cargo build --workspace`.
#                                     Packages: build.yml `bun run typecheck`.
#   migrated_in_ci       : bool    — true iff this unit owns DB migrations that
#                                     ci-migrate.yml applies against Postgres.
#   tests_executed_in_ci : integer — count of this unit's tests a CI job actually
#                                     RUNS (not merely compiles). 0 is the
#                                     meaningful regression-guard value for an
#                                     untested unit. Treated as a FLOOR: the check
#                                     asserts 0 <=> no executed suite exists, and
#                                     >0 <=> an executed suite exists (it does not
#                                     pin the exact live test count).
#
# Optional per-row fields:
#   executed_by          : string  — workflow/job that executes the tests.
#                                     Empty/omitted when tests_executed_in_ci = 0.
#   note                 : string  — free-text rationale (e.g. why a count is 0).
#
# ── How the values are derived (and re-verified by the check) ─────────────────
# compiled_in_ci:
#   * every crate — rust.yml runs `cargo build --workspace --all-targets`.
#   * every package — build.yml runs `bun run typecheck` over the workspace.
# migrated_in_ci — true only for the migration paths ci-migrate.yml lists:
#   packages/db, crates/sf-db, crates/sf-auth, crates/nexum, crates/sharp.
# tests_executed_in_ci:
#   * rust.yml only builds. The one workflow that RUNS a crate's tests is
#     embedder-coverage.yml (issue #760): it executes the nexum embedder for
#     real (pgvector + governed weights + `cargo test -p nexum ...
#     --include-ignored`), so crates/nexum is >0. Every OTHER crate has no
#     cargo-test job -> 0.
#   * Packages are executed only via the test-unit/test-integration globs
#     `packages/*/tests/unit` and `packages/*/tests/integration` (and the
#     paths-gated test-e2e for packages/core). A package is >0 iff it has at
#     least one *.test.ts under tests/unit or tests/integration.
#   * packages/control has only Playwright e2e specs under tests/e2e (not matched
#     by the unit/integration globs) -> 0.
#   * packages/control-core keeps its *.test.ts directly under tests/ (NOT under
#     tests/unit) so the glob does NOT pick them up -> 0 today. (Wiring those in
#     is a later phase; recording 0 here is the regression guard.)
#
# ── Pinned CI seam ────────────────────────────────────────────────────────────
# scripts/check-coverage-truth.sh runs as a workflow step on pull_request -> main
# in the lightweight coverage-truth job of build.yml (no Postgres/weights). Per
# #759 scope it is NOT a required branch-protection context — that is the
# coverage-enforcement phase.

[meta]
schema_version = 1
generated_by = "scripts/check-coverage-truth.sh"

# ── crates/* (13) ─────────────────────────────────────────────────────────────
# Only crates/nexum is executed in CI (embedder-coverage.yml, issue #760); every
# other crate has no cargo-test job, so it is tests_executed_in_ci = 0.

[[unit]]
path = "crates/fastenv"
kind = "crate"
compiled_in_ci = true
migrated_in_ci = false
tests_executed_in_ci = 0
note = "rust.yml builds but never runs crate tests; no cargo-test job exists."

[[unit]]
path = "crates/nexum"
kind = "crate"
compiled_in_ci = true
migrated_in_ci = true
tests_executed_in_ci = 11
executed_by = "embedder-coverage.yml"
note = "embedder gap CLOSED (issue #760): embedder-coverage.yml stands up pgvector + DATABASE_URL + governed weights (rev c9745ed) offline and runs `cargo test -p nexum --test integration --include-ignored` plus the embed.rs ignored unit tests for real (11 integration tests collected; embed_returns_governed_dimension asserts a 384-dim L2 vector; the ingest->embed->store->semantic-search round-trip returns a positive score). The count is a FLOOR (>0); the check does not pin the exact live count. ci-migrate.yml applies crates/nexum/migrations/**."

