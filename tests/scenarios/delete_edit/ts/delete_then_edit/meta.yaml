name: delete_then_edit
category: delete_edit
language: ts
summary: >
  Branch A deletes src/legacy.ts. Branch B edits the same file. git
  surfaces this as a modify/delete conflict; the correct policy depends
  on intent and is the kind of decision Sharp should escalate via Tier 3
  dilemma rather than auto-resolve.
expected_git_outcome: conflict
expected_sharp_outcome: dilemma
notes: |
  This is a legitimate Tier 3 dilemma scenario: neither auto-keep nor
  auto-delete is universally correct. Sharp should return a structured
  dilemma describing both candidate trees and let the calling agent decide.
