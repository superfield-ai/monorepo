name: export_rename_with_import_update
category: refactor
language: ts
summary: >
  Branch A renames the exported constant API_BASE to API_ENDPOINT in
  config.ts and updates the existing import in client.ts. Branch B adds a
  new file service.ts that imports the old name API_BASE. Text merge
  succeeds silently but the merged tree has a broken import. Sharp
  propagates the rename to service.ts.
expected_git_outcome: clean_wrong
expected_sharp_outcome: clean_ok
validator: ts
notes: |
  Export rename scenario. git cannot know that Branch B's new file
  should reference the renamed export introduced by Branch A.
