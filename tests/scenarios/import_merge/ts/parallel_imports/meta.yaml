name: parallel_imports
category: import_merge
language: ts
summary: >
  Both branches modify the function body's return-line expression AND add
  different imports, making the changes incompatible at the expression level.
  This is a Tier 3 case: Sharp correctly escalates to a structured dilemma
  rather than silently picking one side, because expression-level 3-way merge
  is beyond the current Tier 1 strategies.
expected_git_outcome: conflict
expected_sharp_outcome: dilemma
validator: ts
notes: >
  Resolving this automatically would require expression-level AST merge
  (Phase 19.x follow-up). For now, Sharp's correct behavior is to emit a
  structured dilemma so the developer can make an informed decision.
