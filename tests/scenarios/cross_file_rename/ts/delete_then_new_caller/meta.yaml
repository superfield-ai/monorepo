name: delete_then_new_caller
category: cross_file_rename
language: ts
summary: >
  Branch A deletes helper.ts. Branch B adds a new file (report.ts) that
  imports the now-deleted symbol. Git merges cleanly because A's deletion
  and B's new file do not touch the same path, but the merged tree has a
  broken import. Sharp detects this as a false positive (clean_wrong) and
  escalates to dilemma.
expected_git_outcome: clean_wrong
expected_sharp_outcome: dilemma
validator: ts
notes: |
  This is the B3 false-positive variant from the taxonomy: git reports a
  clean merge, but the result is semantically broken because B's new caller
  references a symbol that A deleted. Extends the delete_edit category from
  "B edits the deleted file" to "B adds a brand-new file that calls the
  deleted symbol". Sharp must detect that report.ts imports from ./helper
  while helper.ts no longer exists in the merged tree.
