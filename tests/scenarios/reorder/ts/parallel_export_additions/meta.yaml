name: parallel_export_additions
category: reorder
language: ts
summary: >
  Both branches add a new exported helper at the bottom of the same file.
  git's text merger has no way to know they are independent additions in
  the same hunk and reports a conflict.
expected_git_outcome: conflict
expected_sharp_outcome: clean_ok
validator: ts
notes: |
  Sharp should recognize two independent function definitions and concatenate
  them in either order; both orderings are valid and the verification gate
  (tsc --noEmit) passes for both.
