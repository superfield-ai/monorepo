name: parallel_object_property_additions
category: reorder
language: ts
summary: >
  The most common everyday form of git's adjacent-insertion false conflict:
  both branches add a single new property to the same object literal (e.g.
  a config object, a feature-flags map, a test fixture). Both additions land
  immediately after the same anchor line so git groups them into a single
  conflicting hunk, even though the properties are completely independent.
  This is the notorious "parallel config property" false conflict that hits
  every team working on shared configuration objects.
  Sharp recognises both additions as independent and concatenates them.
expected_git_outcome: conflict
expected_sharp_outcome: clean_ok
validator: ts
notes: >
  This scenario reproduces the notorious Git adjacent-insertion false conflict
  in its minimal everyday form. The reproducer is: two developers each add a
  single-line property to the same config object on separate branches. Git
  reports a conflict because both diffs produce a hunk that inserts after the
  same anchor line ("port: 5432,"). The correct merge includes both properties.
  Sharp solves this with the concat-additions strategy in tier1Merge().
