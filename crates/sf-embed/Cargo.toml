[package]
name = "sf-embed"
description = "Superfield in-process embedding crate — Xenova/all-MiniLM-L6-v2 (384-dim)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "sf_embed"
path = "src/lib.rs"

[dependencies]
# Pure-Rust ML framework — no pre-built native binaries, no glibc version constraints.
candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"
# HuggingFace Hub client for downloading model weights and tokenizer.
hf-hub = { version = "0.3", features = ["tokio"] }
# BERT tokenizer.
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
serde_json = "1"
thiserror = "2.0"
