[package]
name = "sharp"
description = "Sharp VCS core and Rust semantic merge — objects, refs, commits, DAG, agent-episode schema, and rust-analyzer-backed merge with cargo check gate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "sharp"
path = "src/lib.rs"

[dependencies]
sf-db = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
flate2 = { workspace = true }
# AST-equivalence checking for semantic merge (later tasks).
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
# Temporary worktrees / scratch dirs for merge and cargo-check gating.
tempfile = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
serde_yaml = "0.9"
walkdir = "2"
