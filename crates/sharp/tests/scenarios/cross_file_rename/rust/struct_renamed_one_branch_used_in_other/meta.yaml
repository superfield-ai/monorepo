name: struct_renamed_one_branch_used_in_other
category: cross_file_rename
language: rust
summary: >
  Branch A renames a public struct (HttpClient -> RestClient) and updates
  every existing call site. Branch B introduces a new module that uses the
  old name. Text merge produces a clean tree where the rename completed in
  A's files and the new module references the now-nonexistent old name.
  cargo check fails.
expected_git_outcome: clean_wrong
expected_sharp_outcome: clean_ok
validator: rust
