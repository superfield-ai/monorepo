name: trait_method_rename
category: refactor
language: rust
summary: >
  Branch A renames the trait method `describe` to `display` in the
  Describable trait and updates all existing impls. Branch B adds a new
  struct with an impl using the old method name `describe`. Text merge
  produces a clean tree but cargo check fails because the trait no longer
  has a `describe` method. Sharp propagates the rename to Branch B's new
  impl.
expected_git_outcome: clean_wrong
expected_sharp_outcome: clean_ok
validator: rust
notes: |
  Trait method rename scenario. git three-way merge cannot know that
  Branch B's new impl must use the updated method name from Branch A.
  Fixed in the Rust symbol extractor: trait method signatures are now
  extracted as kind=trait_method, enabling detectRenames() to propagate
  the rename.
