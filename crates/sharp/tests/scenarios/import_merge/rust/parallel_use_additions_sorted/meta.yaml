name: parallel_use_additions_sorted
category: import_merge
language: rust
summary: >
  Both branches add new `use` statements that need to be sorted
  alphabetically to satisfy clippy lint. Demonstrates that concat-additions
  correctly merges parallel use statements even when they must appear in
  sorted order.
expected_git_outcome: conflict
expected_sharp_outcome: clean_ok
validator: rust
notes: |
  Unlike parallel_use_lines (which adds any two use statements), this
  fixture specifically checks that Sharp produces a sorted merged import
  block: BTreeMap < HashMap < HashSet. Branch A inserts BTreeMap before
  HashMap; branch B inserts HashSet after HashMap. A smart merge produces
  BTreeMap, HashMap, HashSet in alphabetical order, satisfying clippy's
  useless_attribute / use_sorted lint expectations.
