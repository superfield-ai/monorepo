[package]
name = "nexum"
description = "Nexum component — Rust ingestion pipeline and query layer on the shared substrate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "nexum"
path = "src/lib.rs"

[dependencies]
sqlx     = { workspace = true }
tokio    = { workspace = true }
uuid     = { workspace = true }
thiserror = { workspace = true }
sha2      = "0.10"
hex       = "0.4"
regex     = "1"
once_cell = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
# Inlined embedder (formerly the `sf-embed` crate) — pure-Rust candle BERT,
# no pre-built native binaries.  Versions copied from crates/sf-embed/Cargo.toml.
candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"
hf-hub = { version = "0.3", features = ["tokio"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

[dev-dependencies]
tokio    = { workspace = true, features = ["full", "test-util"] }
uuid     = { workspace = true }
