[package]
name = "superfield"
description = "Superfield single-binary entrypoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "superfield"
path = "src/main.rs"

[dependencies]
sharp = { workspace = true }
nexum = { workspace = true }
sf-db = { workspace = true }
sf-cli = { workspace = true }
sf-serve = { workspace = true }
sf-loop = { workspace = true }
sf-deploy = { workspace = true }
fastenv = { workspace = true }
anyhow = "1"
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
uuid.workspace = true
libc.workspace = true
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
uuid.workspace = true
sqlx.workspace = true
