# Composite action: make the governed embedding weights present OFFLINE.
#
# Mechanism A (issue #760, built on the #770 scout stub), see
# docs/scout/embedding-coverage-offline-weights-and-pgvector-seams.md §1.2.
# The required embedder job (.github/workflows/embedder-coverage.yml) and the
# eval fix (#762) wire this in.
#
# WHY THIS EXISTS: hf-hub 0.3.2 (the version in Cargo.lock) has NO offline
# switch — HF_HUB_OFFLINE=1 is a Python-only flag the Rust crate ignores.
# `Embedder::new()` resolves weights cache-first then falls through to the
# network on a miss, producing `RelativeUrlWithoutBase` on a no-egress runner
# (the eval-todo-app Seed failure). The ONLY lever is to pre-populate the cache
# at the exact path hf-hub's `cache.get()` looks for, so the cache-HIT branch
# is taken and `download()` is never reached.
#
# The exact tree (cache root = <HF_HOME>/hub):
#   <HF_HOME>/hub/models--sentence-transformers--all-MiniLM-L6-v2/
#     ├── refs/c9745ed                      # text file: the FULL 40-char SHA
#     └── snapshots/<full-sha>/{config.json,tokenizer.json,model.safetensors}
# `c9745ed` (GOVERNED_MODEL_REVISION) is the refs FILENAME; the snapshots dir is
# named with the FULL commit SHA the refs file points at.
#
# MECHANISM. We do NOT hardcode the full commit SHA. On a cache miss a populate
# step resolves the full commit SHA for revision c9745ed from the HF API, writes
# refs/c9745ed, and `curl -fL`s the three governed files into
# snapshots/<full-sha>/ — exactly the layout hf-hub's cache-HIT branch needs.
# We use curl rather than hf-hub's own download() because hf-hub 0.3.2's
# metadata() follows the huggingface.co -> S3-CDN redirect through ureq, which
# fails with `RelativeUrlWithoutBase` on a runner whose CDN egress is proxied;
# curl -L follows the same redirect with its own resolver and succeeds.
# `actions/cache` then saves the resulting tree keyed on `models/embedding.lock`,
# so every later run (and this run's offline test steps) restores it and
# resolves with zero huggingface.co egress. A revision bump in the lockfile
# rotates the cache key and forces a fresh populate. A final step runs the
# offline-resolution probe to PROVE Embedder::new() takes the cache-HIT branch.

name: Governed embed weights (offline)
description: >-
  Restore (or, on cache miss, populate) the governed all-MiniLM-L6-v2 weights
  (rev c9745ed) into the hf-hub cache so Embedder::new() resolves offline.

inputs:
  hf-home:
    description: >-
      HF_HOME root (the hf-hub cache root is <hf-home>/hub). Defaults to a
      workspace-local path so the cache tree is captured by actions/cache and
      shared across steps. Embedder::new()/Api::new() honor HF_HOME.
    required: false
    default: ""

outputs:
  hf-home:
    description: The resolved HF_HOME this action populated (export as env for the test steps).
    value: ${{ steps.resolve.outputs.hf-home }}

runs:
  using: composite
  steps:
    # ── Step 0: resolve HF_HOME and export it for downstream steps ───────────
    # hf-hub honors only HF_HOME (it appends `hub`). A workspace-local default
    # keeps the populated tree inside the checkout so actions/cache captures it
    # deterministically regardless of the runner's $HOME.
    - name: Resolve HF_HOME
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        hf_home="${{ inputs.hf-home }}"
        if [ -z "${hf_home}" ]; then
          hf_home="${GITHUB_WORKSPACE}/.hf-cache"
        fi
        mkdir -p "${hf_home}/hub"
        echo "hf-home=${hf_home}" >> "${GITHUB_OUTPUT}"
        echo "HF_HOME=${hf_home}" >> "${GITHUB_ENV}"
        echo "Resolved HF_HOME=${hf_home} (cache root ${hf_home}/hub)"

    # ── Step 1: restore the pre-baked cache tree, keyed on the lockfile ───────
    # A revision bump in models/embedding.lock rotates the key, invalidating the
    # cache and forcing a fresh populate below.
    - name: Restore governed-weights cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.resolve.outputs.hf-home }}/hub
        key: governed-embed-weights-${{ runner.os }}-${{ hashFiles('models/embedding.lock') }}

    # ── Step 2: populate on cache miss (curl the files into the exact tree) ──
    # Only runs when the cache missed. We do NOT drive the populate through
    # hf-hub's own download(): its metadata() does a no-redirect GET to
    # huggingface.co then follows the `Location` header to the S3 CDN, and on
    # this runner that redirect parse fails with `RelativeUrlWithoutBase` (the
    # CDN egress is proxied/blocked even though huggingface.co itself answers).
    # `curl -fL` follows the redirect to the CDN with curl's own resolver and
    # succeeds where ureq fails. We materialise EXACTLY the hf-hub cache-HIT
    # layout: resolve the full commit SHA for revision c9745ed, write
    # refs/c9745ed, and fetch the three files into snapshots/<full-sha>/. Then
    # every offline Embedder::new() takes the cache-HIT branch (no download()).
    - name: Populate governed weights (online, cache miss only)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GOVERNED_MODEL: sentence-transformers/all-MiniLM-L6-v2
        GOVERNED_REV: c9745ed
      run: |
        set -euo pipefail
        echo "Cache miss — fetching governed weights via curl into the hf-hub cache tree."
        echo "HF_HOME=${HF_HOME}"
        root="${HF_HOME}/hub/models--sentence-transformers--all-MiniLM-L6-v2"
        mkdir -p "${root}/refs"

        # Resolve the FULL 40-char commit SHA for the pinned short revision.
        # huggingface.co/api/models/<id>/revision/<rev> returns JSON with `sha`.
        # Parse with python3 (the ci-runner image ships it; jq is not present).
        api_url="https://huggingface.co/api/models/${GOVERNED_MODEL}/revision/${GOVERNED_REV}"
        echo "Resolving full SHA from ${api_url}"
        full_sha="$(curl -fsSL "${api_url}" \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
        if [ -z "${full_sha}" ]; then
          echo "FAIL: could not resolve full commit SHA for ${GOVERNED_REV}" >&2
          exit 1
        fi
        echo "Resolved ${GOVERNED_REV} -> ${full_sha}"
        printf '%s' "${full_sha}" > "${root}/refs/${GOVERNED_REV}"

        snap="${root}/snapshots/${full_sha}"
        mkdir -p "${snap}"
        # Fetch each governed file from the resolve endpoint (curl -L follows the
        # 302 to the CDN). Pin the FULL SHA in the URL for reproducibility.
        for f in config.json tokenizer.json model.safetensors; do
          url="https://huggingface.co/${GOVERNED_MODEL}/resolve/${full_sha}/${f}"
          echo "Downloading ${f} <- ${url}"
          curl -fL --retry 3 --retry-delay 2 -o "${snap}/${f}" "${url}"
        done
        echo "Populated cache tree:"
        find "${root}" -maxdepth 3 -type f -print

    # ── Step 3: verify the exact offline cache layout is present ─────────────
    # Fail LOUDLY (non-zero) if the tree hf-hub's cache-HIT branch needs is not
    # materialised — a green job must never mask absent weights. Asserts the
    # refs/<rev> file and the three snapshot files exist under the full-SHA dir.
    - name: Assert governed-weights cache layout
      shell: bash
      run: |
        set -euo pipefail
        root="${HF_HOME}/hub/models--sentence-transformers--all-MiniLM-L6-v2"
        ref="${root}/refs/c9745ed"
        if [ ! -f "${ref}" ]; then
          echo "FAIL: missing refs file ${ref} (the governed revision pointer)" >&2
          exit 1
        fi
        full_sha="$(tr -d '[:space:]' < "${ref}")"
        if [ -z "${full_sha}" ]; then
          echo "FAIL: refs/c9745ed is empty (must contain the full 40-char SHA)" >&2
          exit 1
        fi
        snap="${root}/snapshots/${full_sha}"
        for f in config.json tokenizer.json model.safetensors; do
          if [ ! -e "${snap}/${f}" ]; then
            echo "FAIL: missing ${snap}/${f} — Embedder::new() would fall through to download()" >&2
            exit 1
          fi
        done
        echo "OK: governed weights present offline at ${snap} (rev c9745ed -> ${full_sha})"

    # ── Step 4: prove offline resolution (the cache-HIT branch is taken) ─────
    # Run the offline-resolution probe with the cache now populated: it
    # constructs Embedder::new() and embeds a string. If resolution still hit
    # the network it would fail with RelativeUrlWithoutBase; passing here PROVES
    # the cache-HIT branch is taken and the weights resolve with no egress.
    - name: Verify offline resolution (Embedder::new from cache)
      shell: bash
      run: |
        set -euo pipefail
        echo "HF_HOME=${HF_HOME} — resolving governed weights offline."
        cargo test -p nexum --test offline_weights_probe -- \
          --include-ignored --exact embedder_resolves_governed_weights_offline
