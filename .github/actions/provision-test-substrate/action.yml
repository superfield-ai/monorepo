# Composite action: provision the shared Rust-test SUBSTRATE — pgvector
# Postgres + DATABASE_URL + applied migrations + governed embed weights — so a
# full-workspace `cargo nextest run` executes the DB-gated and embedder-gated
# tests across crates (sf-db, sf-serve, sharp, superfield, sf-loop, nexum)
# instead of silently skipping them.
#
# STATUS: PROVISION PATH WIRED (issue #765, on the dev-scout #771 skeleton).
# With `mode: provision` this action probes the job-level pgvector service,
# applies the FULL migration set, and makes the governed embed weights present
# OFFLINE — so the DB-gated Rust tests in sf-db / sf-serve / sharp / superfield /
# sf-loop EXECUTE under nextest instead of silently skipping. `mode: stub` (the
# default) remains a COMPILE-SAFE, NO-OP seam: every provisioning step is a
# documented echo, the action exits 0, and it exports nothing required, so
# callers that have not yet stood up a DB stay green. The three
# coverage-enforcement features still agree on this interface: #765 fills it in
# (here), #764 widens the consuming nextest run + marks it required, and #766
# reads the per-package executed-count JSON the rust-test job emits.
#
# ── REUSE PATH (do NOT reinvent — both pieces are merged on main) ─────────────
#   1. Governed weights (OFFLINE): the merged composite action
#      `.github/actions/governed-embed-weights` (issue #760) restores/populates
#      the hf-hub cache keyed on `models/embedding.lock` and PROVES offline
#      resolution. #765 calls it as a step here (it is itself a composite
#      action; `uses:` is allowed inside a composite). Do NOT re-implement the
#      curl/refs/snapshots dance — just `uses: ./.github/actions/governed-embed-weights`.
#   2. pgvector + DATABASE_URL + migrations: the merged job
#      `.github/workflows/embedder-coverage.yml` (issue #760) is the working
#      pattern — a `pgvector/pgvector:pg16` SERVICE, `DATABASE_URL=
#      postgres://superfield:superfield@postgres:5432/superfield`, a /dev/tcp
#      reachability probe, `bun install --frozen-lockfile`, then
#      `bun packages/db/migrate.ts up` to apply the FULL migration set
#      (public -> auth -> nexum -> sharp -> orchestrator; the orchestrator dir
#      is now registered via crates/sf-db/src/migrate.rs and the TS migrator).
#
# IMPORTANT — the Postgres SERVICE cannot live inside a composite action: GitHub
# `services:` are declared on the JOB, not on a composite action. So #765 must
# declare the pgvector service + the container image ON THE rust-test JOB in
# rust.yml (mirroring embedder-coverage.yml), pass the resulting DATABASE_URL in
# as the `database-url` input here, and this action does the
# reachability-probe + migrate + weights inside the job. This action is the
# REUSABLE inner provisioning; the service wiring stays job-level.
#
# Canonical docs: docs/adr-schema-boundary.md, docs/adr-embedding-model.md
# Scout findings:  docs/scout/coverage-enforcement-rust-test-substrate-seams.md

name: Provision test substrate (pgvector + weights)
description: >-
  SCOUT SKELETON. Provision pgvector Postgres + DATABASE_URL + migrations +
  governed embed weights so DB/embedder-gated Rust tests execute under nextest.
  No-op in stub mode; issue #765 fills in the WIRE-HERE steps.

inputs:
  mode:
    description: >-
      "stub" (default) — no-op documented echoes, exit 0, changes nothing.
      "provision" — the real path (issue #765): probe the pgvector service,
      apply the full migration set, and provision the governed weights offline.
    required: false
    default: "stub"
  database-url:
    description: >-
      The pgvector DATABASE_URL the rust-test JOB stood up via a `services:`
      block (services cannot be declared in a composite action). #765 passes the
      job-level service URL here; the provision path probes + migrates it.
    required: false
    default: ""
  hf-home:
    description: >-
      Optional HF_HOME forwarded to the governed-embed-weights action. Empty =
      that action's workspace-local default (.hf-cache).
    required: false
    default: ""

outputs:
  database-url:
    description: The DATABASE_URL the substrate exposes (echoed back for the test step).
    value: ${{ steps.report.outputs.database-url }}

runs:
  using: composite
  steps:
    - name: Substrate mode banner
      shell: bash
      run: |
        set -euo pipefail
        echo "provision-test-substrate: mode=${{ inputs.mode }}"
        if [ "${{ inputs.mode }}" != "provision" ]; then
          echo "STUB MODE: no provisioning performed (no-op seam, exit 0)."
        else
          echo "PROVISION MODE: probe pgvector -> migrate -> governed weights."
          if [ -z "${{ inputs.database-url }}" ]; then
            echo "FAIL: mode=provision requires a non-empty database-url input" >&2
            echo "      (the rust-test job declares the pgvector services: block" >&2
            echo "       and passes its DATABASE_URL in)." >&2
            exit 1
          fi
        fi

    # ── pgvector reachability probe (loud-fail, never silent-skip) ────────────
    # The ci-runner image ships no libpq client (no pg_isready/psql), so probe
    # the same TCP host:port the suite connects to with bash's /dev/tcp, derived
    # from `database-url`. The job-level `pg_isready` service health-check
    # already gates job start; this is a portable in-container assertion. A
    # FAILURE here aborts (exit 1) — a green test run must never mask an absent
    # DB (the loud-skip thesis). Mirrors embedder-coverage.yml.
    - name: Probe pgvector reachability
      if: inputs.mode == 'provision'
      shell: bash
      env:
        SUBSTRATE_DATABASE_URL: ${{ inputs.database-url }}
      run: |
        set -euo pipefail
        # Derive host:port from postgres://user:pass@host:port/db.
        hostport="${SUBSTRATE_DATABASE_URL#*@}"
        hostport="${hostport%%/*}"
        host="${hostport%%:*}"
        port="${hostport##*:}"
        echo "Probing ${host}:${port} (from database-url) ..."
        for i in $(seq 1 30); do
          if (exec 3<>"/dev/tcp/${host}/${port}") 2>/dev/null; then
            echo "pgvector reachable at ${host}:${port} after ${i}s"; exit 0
          fi
          sleep 1
        done
        echo "FAIL: ${host}:${port} not reachable from the job container" >&2
        exit 1

    # ── Apply the full migration set with the unified bun migrator ────────────
    # `bun install --frozen-lockfile` then `bun packages/db/migrate.ts up`
    # applies public -> auth -> nexum -> sharp -> orchestrator (the SAME migrator
    # crates/sf-db/src/migrate.rs mirrors), creating the schema the DB-gated
    # tests assert against (workspaces, nexum.*, auth.*, sharp.*, orchestrator.*,
    # blocks.embedding vector(384)). A migration failure aborts the job.
    - name: Install bun deps
      if: inputs.mode == 'provision'
      shell: bash
      run: bun install --frozen-lockfile

    - name: Apply migrations (migrate up)
      if: inputs.mode == 'provision'
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}
      run: bun packages/db/migrate.ts up

    # ── Make the governed weights present OFFLINE (reuse #760's action) ───────
    # The merged composite action restores/populates the hf-hub cache keyed on
    # models/embedding.lock and PROVES offline resolution, exporting HF_HOME for
    # the test steps. We do NOT re-implement the curl/refs/snapshots dance.
    - name: Provision governed embed weights (offline)
      if: inputs.mode == 'provision'
      uses: ./.github/actions/governed-embed-weights
      with:
        hf-home: ${{ inputs.hf-home }}

    - name: Report substrate outputs
      id: report
      shell: bash
      run: |
        set -euo pipefail
        echo "database-url=${{ inputs.database-url }}" >> "${GITHUB_OUTPUT}"
