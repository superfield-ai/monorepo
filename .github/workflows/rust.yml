name: Rust

# The `rust-test` job below is a REQUIRED branch-protection context (issue
# #764). A required status check must be SATISFIABLE on every PR shape that is
# allowed to merge — if the workflow never triggers, the required context never
# reports and branch protection (strict=true) leaves the PR BLOCKED forever
# (the docs-only-required-checks-skipped failure mode, blocker #753). The old
# narrow `paths:` allowlist (Cargo/crates/rust.yml/nextest.toml only) would have
# made the new required context unsatisfiable for the many PRs that touch only
# TS packages or only workflow files — i.e. it would have started BLOCKING those
# PRs. So this trigger now mirrors the OTHER required heavy Rust job
# (embedder-coverage.yml): `paths-ignore` for pure docs/text only, so the
# required Rust test context reports on every code/workflow PR. (Pure docs-only
# PRs — paths-ignored here — are made satisfiable by the always-on
# required-status-bypass.yml reporter (#788, which resolved blocker #753): it
# posts skipped-success for the required Rust contexts that did not trigger, so
# docs-only PRs are no longer deadlocked. The canonical required set is the
# contexts listed in scripts/required-status-contexts.txt (11 today), the
# in-repo mirror of main's branch protection.)
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "**.txt"]
  pull_request:
    branches: [main]
    # `ready_for_review` is in the type list so promoting a draft to ready
    # re-triggers the required job (it is draft-gated below, like
    # embedder-coverage.yml).
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "**.txt"]
  workflow_dispatch: {}

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build workspace
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Smoke test (noop)
        run: cargo run --bin superfield -- noop

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all --check

  # ── REQUIRED WORKSPACE TEST RUN (issue #764) ────────────────────────────────
  # The general enforcement of invariant 2 ("exit 0 != tested") for Rust: a
  # REQUIRED status context that actually RUNS the Rust suite, so a green Rust
  # check can no longer mean only "the workspace compiled". Today rust.yml's
  # `build` job builds + clippies + fmts but executes ZERO tests; this job runs
  # `cargo nextest run --workspace` and is registered in main's required
  # branch-protection contexts (the job `name:` below is that context).
  #
  # SCOPE — deliberately the hermetic, non-#[ignore]d workspace suite (NO
  # `--run-ignored all`, NO DB). The DB-gated #[ignore]d corpus is the
  # `rust-test-seam` job's concern (issue #765): a large fraction of those
  # ignored tests genuinely FAIL even against a correct substrate (they need an
  # unprovisioned rust-analyzer / tsserver bun-bridge, or assert not-yet-built
  # schema), so pulling them into the REQUIRED happy-path run would turn CI red.
  # We must NOT silence them with skips (loud-skip-never-silent-skip). So the
  # required run executes the >0 hermetic unit/integration tests that pass
  # without external resources, while `--no-tests=fail` still makes a
  # zero-collection run a HARD failure (the self-check below proves it).
  #
  # This job does NOT add any `cargo nextest run -p <crate>` invocation, so it
  # does not change the per-crate execution model scripts/check-coverage-truth.sh
  # derives from the seam job's `-p` line, nor the per-package count source #766
  # consumes — those stay anchored on `rust-test-seam`.
  rust-test:
    # The required context name. Keep STABLE: it is registered verbatim in main's
    # required_status_checks, so renaming it silently drops the protection.
    name: Rust workspace tests (nextest, no-tests=fail)
    # Draft-gated like embedder-coverage.yml (a test-execution / system-
    # correctness job): skipped while the PR is a draft (a skipped required check
    # counts as success), and re-run for real on `ready_for_review`. Non-PR
    # events (push/dispatch) have no draft field -> the guard is false -> it runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    container:
      # rust:latest ships a C toolchain (build scripts need a linker); mirrors
      # the `build` job. cargo-nextest is installed below.
      image: rust:latest
    env:
      CI_CLASS: system-correctness
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Pinned nextest the phase standardises on (0.9.85; `--no-tests=fail`).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: "cargo nextest --version (resolves, exit 0)"
        run: cargo nextest --version

      # ── AC1: the required happy-path run ────────────────────────────────────
      # `cargo nextest run --workspace` executes the hermetic (non-#[ignore]d)
      # Rust suite. `--no-tests=fail` is passed EXPLICITLY (also the 0.9.85
      # default) so a future empty/mis-filtered run hard-fails instead of going
      # green. `--profile ci` selects the deterministic CI profile (retries=0,
      # fail-fast=false) pinned in .config/nextest.toml. The run exits 0 on a
      # clean tree with >0 tests collected; nextest's own "Summary" line in the
      # log reports the executed count (AC: a reported test count > 0). If zero
      # tests were somehow collected, --no-tests=fail makes THIS step red.
      # `--message-format libtest-json` makes nextest emit per-test NDJSON on
      # stdout (its human progress + Summary line stay on stderr, still visible
      # in the log). We `tee` that NDJSON to a file so the next step can derive
      # the per-package executed-test map that issue #766's coverage-delta gate
      # consumes — WITHOUT weakening the required assertion: the run still
      # executes the hermetic suite, `--no-tests=fail` still hard-fails a
      # zero-collection run, and `pipefail` propagates a test failure through the
      # `tee`. The experimental format is opt-in via the env var below.
      - name: "Workspace nextest run (--no-tests=fail, >0 tests, exit 0) [AC1]"
        env:
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON: "1"
        run: |
          set -euo pipefail
          cargo nextest run --workspace --profile ci --no-tests=fail \
            --message-format libtest-json | tee nextest-hermetic.jsonl

      # ── Per-package executed-count source for #766 (hermetic half) ──────────
      # Publish the raw libtest-json NDJSON as an artifact. The coverage-delta
      # gate job (which runs in the ci-runner image with python3) derives the
      # {pkg: executed-count} map from it — the SAME derivation the seam job uses
      # (each per-test "ok"/"failed" event names the test "<pkg>::<binary>$...";
      # the owning package is the prefix before "::"). We deliberately do NOT
      # parse it here: the `rust:latest` container has no python3, and uploading
      # the raw NDJSON keeps this required job free of extra tool dependencies.
      - name: "Upload hermetic nextest NDJSON (per-package source) [#766]"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-nextest-hermetic-jsonl
          path: nextest-hermetic.jsonl
          if-no-files-found: error

      # ── AC2: the self-check proving --no-tests=fail is active ───────────────
      # Constrain the run to a filter that matches NOTHING. With --no-tests=fail
      # nextest must exit NON-zero on the empty collection. We invert the exit
      # code: if the constrained run unexpectedly SUCCEEDS, the enforcement is
      # not active and we fail the job loudly; if it fails (the expected path),
      # the self-check passes. This proves a green Rust check can never be a
      # zero-tests-ran false green.
      - name: "Self-check: zero-collection run must fail (--no-tests=fail proof) [AC2]"
        run: |
          set -euo pipefail
          # A filter no test name can match -> nextest collects zero tests.
          NONE='test(/__sf_zero_collection_selfcheck_no_such_test__/)'
          if cargo nextest run --workspace --profile ci --no-tests=fail -E "$NONE"; then
            echo "FAIL: a zero-collection nextest run exited 0 — --no-tests=fail is NOT active; a green Rust check could mean 0 tests ran." >&2
            exit 1
          fi
          echo "OK: zero-collection run exited non-zero as required — --no-tests=fail is active."

  # ── SHARED RUST-TEST SEAM (dev-scout #771, coverage-enforcement phase) ──────
  # This job is the shared Rust-test seam the three phase features land on:
  #   #765 (THIS PR) — fills in the provision-test-substrate composite action
  #          (pgvector + DATABASE_URL + migrations + governed weights), declares
  #          the pgvector `services:` block + container image ON THIS JOB, and
  #          runs the DB-gated tests in the named crates so they EXECUTE.
  #   #764 — (DONE) the REQUIRED `--workspace` run + `--no-tests=fail` enforcement
  #          landed as the SEPARATE `rust-test` job above (the hermetic,
  #          non-#[ignore]d suite), and that job's name is the registered
  #          branch-protection context. The seam below stays NON-required and
  #          DB-gated so its genuinely-failing ignored corpus never gates main.
  #          This seam remains the per-package executed-count source for #766.
  #   #766 — consumes the per-package executed-count JSON emitted below in its
  #          coverage-delta gate.
  #
  # It is DELIBERATELY NOT yet a required context (that promotion is #764).
  # Scout findings: docs/scout/coverage-enforcement-rust-test-substrate-seams.md
  rust-test-seam:
    name: Rust test seam (scout #771, not required)
    # Draft-gated: now that rust.yml triggers on every non-docs PR (issue #764
    # broadened the trigger so the required `rust-test` context is satisfiable),
    # this heavy DB-substrate job skips drafts and runs from ready-for-review on,
    # matching the embedder-coverage.yml system-correctness pattern. It is NOT a
    # required context, so a skip here never blocks a merge.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    container:
      # ci-runner image (python3 + curl + bun); cargo-nextest is installed below.
      # The pgvector `services:` block lives here because a GitHub service cannot
      # be declared inside a composite action — only on the job (issue #765).
      image: ghcr.io/superfield-ai/ci-runner:latest
    services:
      postgres:
        # pgvector/pgvector:pg16 ships the `vector` extension the nexum schema
        # migration requires (blocks.embedding vector(384)).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: superfield
          POSTGRES_PASSWORD: superfield
          POSTGRES_DB: superfield
        options: >-
          --health-cmd "pg_isready -U superfield -d superfield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        shell: bash
    env:
      # Host is the service name `postgres` because the job runs in a container.
      # The provision-test-substrate action probes + migrates this URL, and the
      # DB-gated tests read it to take their executing (non-skip) branch.
      DATABASE_URL: postgres://superfield:superfield@postgres:5432/superfield
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install C toolchain (Rust build scripts need a linker)
        run: apt-get update -y && apt-get install -y --no-install-recommends gcc libc6-dev pkg-config libssl-dev

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # nextest binary. Pinned tool the phase standardises on (--no-tests=fail).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: "cargo nextest --version (AC: resolves, exit 0)"
        run: cargo nextest --version

      # ── Reusable substrate seam (provision mode — issue #765) ───────────────
      # Referenced here so `grep -rn 'provision-test-substrate' .github/workflows/`
      # returns a hit (scout AC). In provision mode it probes the pgvector
      # service above, applies the full migration set, and provisions the
      # governed weights offline, so the DB-gated tests below EXECUTE instead of
      # silently skipping. A probe/migration failure aborts the job (loud-skip).
      - name: Provision test substrate (pgvector + migrations + weights)
        uses: ./.github/actions/provision-test-substrate
        with:
          mode: provision
          database-url: ${{ env.DATABASE_URL }}

      # ── DB-gated nextest run over the named crates + the per-package count ──
      #    source #766 consumes (one coherent step). ────────────────────────────
      # With the substrate active (DATABASE_URL set, migrations applied), the
      # previously-#[ignore]d DB-gated tests in sf-db / sf-serve / sharp /
      # superfield / sf-loop EXECUTE under `--run-ignored all`. We select a
      # STABLE, purely-DB subset per crate with a filterset: a sizeable fraction
      # of the broader #[ignore]d corpus needs resources this fixture does NOT
      # provide (live rust-analyzer, the tsserver bun-bridge), or asserts
      # not-yet-implemented schema/behaviour (workspace_id NOT-NULL/FK back-fill,
      # multi-statement-prepared bugs) — those are EXCLUDED (tracked in #764,
      # recorded durably in .agents/agent-warnings.md "Curated nextest filterset
      # hides a real DB-test failure class"), NOT silently greened here. They
      # FAIL against a correct substrate, so re-include them — expand this
      # filterset and assert >0 — only when their fix lands: (1) the workspace_id
      # NOT-NULL/FK back-fill schema, (2) the sharp multi-statement-prepared bug,
      # (3) sf-loop page-revision writers seeding a public.workspaces row. See
      # agent-warnings.md for the per-class re-inclusion conditions (#789).
      # NOTE: keep the per-crate `-p` flags below — widening to
      # `cargo nextest run --workspace` would bypass check-coverage-truth.sh's
      # `-p` parser and silently over-claim the five >0 coverage-truth rows;
      # update that parser in lockstep with any --workspace move (#789).
      # --test-threads=1 mirrors
      # embedder-coverage.yml: these integration tests share schema tables and
      # are not all workspace-isolated, so serial execution is deterministic.
      # --no-tests=fail is passed EXPLICITLY (also the 0.9.85 default) so a
      # zero-collection / mis-filtered run hard-fails (the LOUD-fail thesis).
      #
      # We derive the executed count from nextest's libtest-json output, NOT from
      # the human "Summary" line: that line embeds ANSI colour codes (CARGO_TERM
      # _COLOR) that defeat a brittle regex. The JSON is the SAME per-package
      # source #766's coverage-delta gate reads: each per-test "ok"/"failed"
      # event names the test "<pkg>::<binary>$<path>"; the owning package is the
      # prefix before "::". This step ASSERTS >0 executed FOR EACH named crate
      # (AC + test plan) and PRINTS the per-package map #766 will consume.
      - name: "DB-gated nextest run + per-package count source (5 crates, >0 each; pins #766)"
        env:
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON: "1"
        run: |
          set -euo pipefail
          # Per-crate stable, purely-DB selection (verified to pass against a
          # freshly migrated pgvector DB). Keep all `-p` flags on the same line
          # as `cargo nextest run` so check-coverage-truth.sh can parse the
          # executed crates from this invocation.
          FILTER='(package(sf-db) & (binary(provision_migrate_integration) | binary(rls_workspace_isolation_integration))) | (package(superfield) & binary(daemon_loop_integration)) | (package(sf-serve) & test(/tests::integration::/)) | (package(sharp) & (test(db_round_trip_snapshot_build_materialize_is_identity) | test(episode_open_append_finish_query) | test(init_add_commit_roundtrip) | test(merge_flow_onboard_workspace_is_idempotent))) | (package(sf-loop) & (test(cursor_persists_after_step_commit) | test(loop_resumes_from_cursor_after_restart) | test(project_graph_derive_writes_nodes)))'
          # Run for real (exit code propagates: a test failure or zero-collection
          # under --no-tests=fail fails the step), capturing libtest-json NDJSON.
          cargo nextest run -p sf-db -p sf-serve -p sharp -p superfield -p sf-loop --profile ci --run-ignored all --no-tests=fail --test-threads=1 -E "$FILTER" --message-format libtest-json 2>/dev/null | tee nextest.jsonl
          python3 - <<'PY'
          import json, collections, sys
          REQUIRED = ["sf-db", "sf-serve", "sharp", "superfield", "sf-loop"]
          executed = collections.Counter()
          with open("nextest.jsonl") as fh:
              for line in fh:
                  line = line.strip()
                  if not line.startswith("{"):
                      continue
                  try:
                      ev = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if ev.get("type") == "test" and ev.get("event") in ("ok", "failed"):
                      pkg = ev.get("name", "").split("::", 1)[0]
                      if pkg:
                          executed[pkg] += 1
          print("per-package executed-test counts (for #766 coverage-delta):")
          for pkg, n in sorted(executed.items()):
              print(f"  {pkg}: {n}")
          # Persist the DB-gated half of the per-package map BEFORE the loud-fail
          # check below, so the coverage-delta gate (#766) still has these counts
          # even on a run that goes red for a different reason. The gate merges
          # this with the hermetic map from the `rust-test` job.
          with open("rust-pkg-counts-seam.json", "w") as out:
              json.dump(dict(executed), out)
          # LOUD fail: every named crate must have executed >0 DB-gated tests, so
          # a green compile that executed 0 for any crate cannot masquerade as
          # tested (exit 0 != tested).
          missing = [c for c in REQUIRED if executed.get(c, 0) <= 0]
          if missing:
              sys.exit(f"FAIL: 0 tests executed for {missing} — exit 0 != tested")
          PY

      # Publish the DB-gated per-package map for the coverage-delta gate (#766).
      # `if: always()` so the artifact exists even when the loud-fail check above
      # trips: the JSON is written before that exit.
      - name: "Upload seam per-package counts [#766]"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-pkg-counts-seam
          path: rust-pkg-counts-seam.json
          if-no-files-found: warn

  # ── REQUIRED SHARP MERGE-GUARANTEE PROVING RUN (issue #834) ─────────────────
  # crates/sharp/src/merge_flow.rs advertises a "no-non-compiling-merge"
  # guarantee: a merge whose output would not compile is REFUSED before it
  # reaches storage. Every test that PROVES that refusal was `#[ignore]`d and
  # excluded from CI — the hermetic `rust-test` job skips `#[ignore]`d tests and
  # the DB-only `rust-test-seam` filterset explicitly excludes the
  # rust-analyzer/cargo-dependent corpus — so a green Rust check proved the
  # compile-gate NEVER executed (an executed-coverage-invariant / loud-skip
  # violation). This job provisions the two resources those proofs need
  # (rust-analyzer + cargo) and EXECUTES them under `--run-ignored all`, so the
  # guarantee is proven by tests that actually run in a required check rather
  # than only asserted in a doc comment.
  #
  # REQUIRED CONTEXT: the job `name:` below is registered in
  # scripts/required-status-contexts.txt (the in-repo mirror of main's required
  # branch-protection contexts). Draft-gated + the rust.yml
  # `paths-ignore: ["**.md","**.txt"]` trigger mirror the other required heavy
  # Rust jobs, so the context reports on every code/workflow PR (pure docs-only
  # PRs, paths-ignored here, are made satisfiable by the always-on
  # required-status-bypass.yml reporter, #788).
  sharp-merge-guarantee:
    # The required context name. Keep STABLE: it is registered verbatim in
    # scripts/required-status-contexts.txt / main's required_status_checks, so
    # renaming it silently drops the protection.
    name: Sharp merge-guarantee (compile-gate refusal + scenarios)
    # Draft-gated like the other test-execution jobs (a skipped required check
    # counts as success; re-runs for real on `ready_for_review`).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    container:
      # ci-runner ships python3 (used below to derive the executed count from
      # nextest's libtest-json), curl, and bun. The Rust toolchain + C linker are
      # installed below (same pattern as rust-test-seam). No `permissions:` block
      # so the job keeps the repo-default `packages: read` needed to pull this
      # private GHCR image.
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    env:
      CI_CLASS: system-correctness
    steps:
      - uses: actions/checkout@v4

      # rust-analyzer is provisioned as a rustup COMPONENT of the stable
      # toolchain: `semantic_merge_rust` resolves it via PATH then
      # `rustup which rust-analyzer` (crates/sharp/src/rust_analyzer_client.rs),
      # so the component install is exactly the resource the refusal + scenario
      # proofs need. The compile gate itself shells out to `cargo check`, which
      # this toolchain provides.
      - name: Install stable toolchain (+ rust-analyzer component)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer

      - name: Install C toolchain (Rust build scripts + cargo check need a linker)
        run: apt-get update -y && apt-get install -y --no-install-recommends gcc libc6-dev pkg-config libssl-dev

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # ── LOUD provisioning check: rust-analyzer + cargo MUST resolve ─────────
      # If the component is missing, the semantic-merge proof would silently take
      # its "no rust-analyzer" path or error inconsistently. Fail HERE, loudly,
      # so a missing resource can never masquerade as a passed guarantee (this is
      # the loud-skip-never-silent-skip contract this issue is about).
      - name: "Provisioning check: rust-analyzer + cargo resolve (loud)"
        run: |
          set -euo pipefail
          cargo --version
          cargo nextest --version
          RA="$(rustup which rust-analyzer)"
          echo "rust-analyzer resolved to: $RA"
          "$RA" --version

      # ── AC1: the compile-gate refusal proofs EXECUTE (>0 ran) ───────────────
      # The three tests that prove a non-compiling merge is REFUSED are
      # `#[ignore]`d (they need live cargo / rust-analyzer). `--run-ignored all`
      # runs them; `--no-tests=fail` (also the 0.9.85 default, passed explicitly)
      # hard-fails a zero-collection run. We derive the executed count from
      # nextest's libtest-json NDJSON (the human "Summary" line embeds ANSI
      # colour that defeats a regex) and ASSERT it is > 0, so a green compile can
      # never masquerade as "the compile gate ran".
      - name: "Compile-gate refusal proofs run (--run-ignored, >0 executed) [AC1]"
        env:
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON: "1"
        run: |
          set -euo pipefail
          FILTER='test(non_compiling_merge_is_blocked) | test(semantic_merge_refuses_non_compiling_output) | test(self_hosting_gate_compile_gate_refuses_bad_merge)'
          cargo nextest run -p sharp --profile ci --run-ignored all --no-tests=fail \
            -E "$FILTER" --message-format libtest-json 2>/dev/null | tee refusal.jsonl
          python3 - refusal.jsonl 3 "compile-gate refusal proofs" <<'PY'
          import json, sys
          path, want_min, label = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          ran = 0
          with open(path) as fh:
              for line in fh:
                  line = line.strip()
                  if not line.startswith("{"):
                      continue
                  try:
                      ev = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if ev.get("type") == "test" and ev.get("event") in ("ok", "failed"):
                      ran += 1
          print(f"{label}: {ran} test(s) executed in CI")
          if ran < want_min:
              sys.exit(f"FAIL: expected >= {want_min} {label} to execute, got {ran} — exit 0 != tested")
          PY

      # ── AC2: the semantic scenario corpus EXECUTES (>0 ran) ─────────────────
      # crates/sharp/tests/scenarios.rs walks the fixture corpus and asserts each
      # merge's classified Outcome (incl. `clean_wrong` = the compile gate
      # rejected a textual merge). Every scenario needs live rust-analyzer +
      # cargo, so each is `#[ignore]`d; `--run-ignored all` runs the corpus. Same
      # libtest-json >0 assertion as AC1.
      - name: "Scenario corpus runs (--run-ignored, >0 executed) [AC2]"
        env:
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON: "1"
        run: |
          set -euo pipefail
          cargo nextest run -p sharp --profile ci --run-ignored all --no-tests=fail \
            --test scenarios --message-format libtest-json 2>/dev/null | tee scenarios.jsonl
          python3 - scenarios.jsonl 1 "sharp scenario corpus" <<'PY'
          import json, sys
          path, want_min, label = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          ran = 0
          with open(path) as fh:
              for line in fh:
                  line = line.strip()
                  if not line.startswith("{"):
                      continue
                  try:
                      ev = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if ev.get("type") == "test" and ev.get("event") in ("ok", "failed"):
                      ran += 1
          print(f"{label}: {ran} scenario test(s) executed in CI")
          if ran < want_min:
              sys.exit(f"FAIL: expected >= {want_min} {label} to execute, got {ran} — exit 0 != tested")
          PY

      # ── Self-check: --no-tests=fail is active for THIS job ──────────────────
      # Constrain the run to a filter that matches NOTHING. With --no-tests=fail
      # nextest MUST exit non-zero on the empty collection; we invert the exit
      # code so a zero-collection run that unexpectedly SUCCEEDS fails the job
      # loudly. This proves the >0 assertions above cannot be a
      # zero-tests-ran false green.
      - name: "Self-check: zero-collection run must fail (--no-tests=fail proof)"
        run: |
          set -euo pipefail
          NONE='test(/__sf_sharp_merge_guarantee_zero_collection_no_such_test__/)'
          if cargo nextest run -p sharp --profile ci --run-ignored all --no-tests=fail -E "$NONE"; then
            echo "FAIL: a zero-collection nextest run exited 0 — --no-tests=fail is NOT active; the >0 proofs above could be a false green." >&2
            exit 1
          fi
          echo "OK: zero-collection run exited non-zero as required — --no-tests=fail is active."

  # ── REQUIRED COVERAGE-DELTA GATE (issue #766) ───────────────────────────────
  # Enforces invariant 2 ("exit 0 != tested") at PACKAGE granularity: if this
  # PR modifies a Rust package, at least one of that package's tests must have
  # EXECUTED in CI. The gate merges the per-package executed-count maps the two
  # nextest jobs above publish — the hermetic `rust-test` map (every crate with
  # non-#[ignore]d tests) UNION the DB-gated `rust-test-seam` map (the
  # #[ignore]d corpus) — so a package whose tests ran in EITHER job counts as
  # executed. It then maps this PR's changed paths to owning packages and fails
  # if any touched package's merged count is 0.
  #
  # REQUIRED-CONTEXT SATISFIABILITY (blocker #753): the job `name:` below is a
  # required branch-protection context, so it must be satisfiable on every
  # mergeable PR shape. Two guarantees keep it from deadlocking unrelated PRs:
  #   1. The gate is a NO-OP PASS when the diff touches no Rust package — TS-only
  #      / workflow-only PRs go green (check-coverage-delta.sh exits 0).
  #   2. Draft-gated + the rust.yml `paths-ignore: ["**.md","**.txt"]` trigger
  #      mirror the other required heavy Rust jobs, so the context reports on
  #      every code/workflow PR (pure docs-only PRs, paths-ignored here, are made
  #      satisfiable by the always-on required-status-bypass.yml reporter (#788,
  #      which resolved blocker #753), same as the other contexts in
  #      scripts/required-status-contexts.txt).
  coverage-delta:
    # The required context name. Keep STABLE: registered verbatim in main's
    # required_status_checks; renaming silently drops the protection.
    name: Rust coverage-delta (touched package ran >0 tests)
    # Draft-gated like the other system-correctness jobs (skipped required check
    # counts as success; re-runs for real on `ready_for_review`).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Consumes both nextest jobs' per-package count artifacts, so it runs after
    # them. Both are draft-gated identically, so on a ready PR all three run.
    needs: [rust-test, rust-test-seam]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      # Required to `docker pull` the private GHCR `ci-runner` image below. An
      # explicit permissions block NARROWS the job token and drops the
      # repo-default `packages: read`, so the container step 403s before any
      # gate step runs unless we grant it back (the sibling rust-test-seam job
      # pulls the same image only because it declares no permissions block).
      packages: read
    container:
      # ci-runner ships python3 + curl (the gate + self-test + the PR-files
      # fetch are pure python3/bash; no Rust toolchain needed here).
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    env:
      CI_CLASS: system-correctness
    steps:
      - uses: actions/checkout@v4

      - name: Download hermetic nextest NDJSON
        uses: actions/download-artifact@v4
        with:
          name: rust-nextest-hermetic-jsonl
          path: counts-hermetic

      - name: Download seam per-package counts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: rust-pkg-counts-seam
          path: counts-seam

      # ── Self-test the gate ON EVERY PR (issue #766 test plan) ───────────────
      # Feeds check-coverage-delta.sh synthetic inputs and asserts zero-run
      # blocks / >0-run passes / no-rust no-ops. Runs unconditionally here so the
      # gate proves itself in CI (loud-skip-never-silent-skip): a regression or a
      # missing python3 fails THIS step.
      - name: "Self-test the coverage-delta gate [#766 test plan]"
        run: bash scripts/check-coverage-delta.selftest.sh

      # ── Merge the two per-package count maps into one report ────────────────
      - name: Merge per-package executed-count reports
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, collections, os
          merged = collections.Counter()

          # Hermetic half: parse the raw libtest-json NDJSON from the rust-test
          # job (each "ok"/"failed" test event names "<pkg>::<binary>$...").
          jsonl = "counts-hermetic/nextest-hermetic.jsonl"
          if os.path.exists(jsonl):
              with open(jsonl) as fh:
                  for line in fh:
                      line = line.strip()
                      if not line.startswith("{"):
                          continue
                      try:
                          ev = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if ev.get("type") == "test" and ev.get("event") in ("ok", "failed"):
                          pkg = ev.get("name", "").split("::", 1)[0]
                          if pkg:
                              merged[pkg] += 1
          else:
              print(f"note: {jsonl} absent — treating hermetic half as empty")

          # DB-gated half: the seam job already reduced its run to a JSON map.
          seam = "counts-seam/rust-pkg-counts-seam.json"
          if os.path.exists(seam):
              with open(seam) as fh:
                  for pkg, n in json.load(fh).items():
                      merged[pkg] += int(n)
          else:
              print(f"note: {seam} absent — treating DB-gated half as empty")

          with open("rust-pkg-counts.json", "w") as out:
              json.dump(dict(merged), out)
          print("merged per-package executed counts:", dict(merged))
          PY

      # ── Compute the PR's changed files (the diff this gate maps to packages) ─
      # On non-PR events (push/dispatch) there is no PR diff, so the list is
      # empty and the gate is a no-op pass — required contexts are evaluated on
      # PRs anyway.
      - name: Compute changed files (PR diff)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          : > changed-files.txt
          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "${PR_NUMBER:-}" ]; then
            echo "non-PR event ($EVENT_NAME): empty changed-file list (gate no-ops)."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ["REPO"]; pr = os.environ["PR_NUMBER"]; tok = os.environ["GH_TOKEN"]
          names, page = [], 1
          while True:
              url = f"https://api.github.com/repos/{repo}/pulls/{pr}/files?per_page=100&page={page}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {tok}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "coverage-delta-gate",
              })
              with urllib.request.urlopen(req) as resp:
                  batch = json.load(resp)
              if not batch:
                  break
              names.extend(f["filename"] for f in batch)
              if len(batch) < 100:
                  break
              page += 1
          with open("changed-files.txt", "w") as out:
              out.write("\n".join(names) + ("\n" if names else ""))
          print(f"PR #{pr} changed {len(names)} file(s).")
          PY

      # ── The gate itself (issue #766 acceptance criteria) ────────────────────
      - name: "Coverage-delta gate — touched packages ran >0 tests [#766]"
        run: |
          bash scripts/check-coverage-delta.sh \
            --changed-files changed-files.txt \
            --counts rust-pkg-counts.json \
            --workspace-root "$GITHUB_WORKSPACE"
