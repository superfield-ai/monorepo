name: Rust

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "!crates/**/*.md"
      - "!crates/**/docs/**"
      - ".github/workflows/rust.yml"
      - ".config/nextest.toml"
      - ".github/actions/provision-test-substrate/**"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "!crates/**/*.md"
      - "!crates/**/docs/**"
      - ".github/workflows/rust.yml"
      - ".config/nextest.toml"
      - ".github/actions/provision-test-substrate/**"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build workspace
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Smoke test (noop)
        run: cargo run --bin superfield -- noop

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all --check

  # ── SCOUT SEAM (dev-scout #771, coverage-enforcement phase) ─────────────────
  # This job PINS the shared Rust-test seam the three phase features all edit, so
  # they land sequentially WITHOUT colliding on rust.yml:
  #   #765 — fills in the provision-test-substrate composite action (pgvector +
  #          DATABASE_URL + migrations + governed weights) and declares the
  #          pgvector `services:` block + container image ON THIS JOB.
  #   #764 — promotes the trivial `cargo nextest run -p sf-auth` below to a
  #          `cargo nextest run --workspace --profile ci --no-tests=fail` and
  #          REGISTERS this job's name as a required branch-protection context.
  #   #766 — consumes the per-package executed-count JSON emitted below in its
  #          coverage-delta gate.
  #
  # It is DELIBERATELY NOT a required context (that promotion is #764), runs only
  # a single DB-free crate (sf-auth's non-ignored unit tests), and references
  # the provision-test-substrate skeleton in `stub` mode so it stays green with
  # no DB. Scout findings: docs/scout/coverage-enforcement-rust-test-substrate-seams.md
  rust-test-seam:
    name: Rust test seam (scout #771, not required)
    runs-on: [self-hosted, Linux, X64]
    container:
      # ci-runner image (python3 + curl); cargo-nextest is installed below.
      # #765 adds the pgvector `services:` block here (a GitHub service cannot
      # live in a composite action; it must be declared on the job).
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install C toolchain (Rust build scripts need a linker)
        run: apt-get update -y && apt-get install -y --no-install-recommends gcc libc6-dev pkg-config libssl-dev

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # nextest binary. Pinned tool the phase standardises on (--no-tests=fail).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: "cargo nextest --version (AC: resolves, exit 0)"
        run: cargo nextest --version

      # ── Reusable substrate seam (stub mode = no-op; #765 fills it in) ────────
      # Referenced here so `grep -rn 'provision-test-substrate' .github/workflows/`
      # returns a hit (scout AC). In stub mode it provisions nothing and exits 0,
      # so this seam job stays green without a DB. #765 flips it to `provision`
      # and passes the job-level pgvector DATABASE_URL in.
      - name: Provision test substrate (stub seam — provision-test-substrate)
        uses: ./.github/actions/provision-test-substrate
        with:
          mode: stub

      # ── Trivial nextest run over one DB-free crate + the per-package count ──
      #    source #766 consumes (one coherent step). ────────────────────────────
      # sf-auth's non-ignored unit tests need NO DATABASE_URL (the DB-gated ones
      # are #[ignore]d and excluded by default), so this stays green with no DB.
      # --no-tests=fail is passed EXPLICITLY (it is also the 0.9.85 default) so a
      # zero-collection run hard-fails (the LOUD-fail thesis); #764 widens
      # `-p sf-auth` to `--workspace`.
      #
      # We derive the executed count from nextest's libtest-json output, NOT from
      # the human "Summary" line: that line embeds ANSI colour codes (CARGO_TERM
      # _COLOR) that defeat a brittle regex. The JSON is the SAME per-package
      # source #766's coverage-delta gate reads: each per-test "ok"/"failed"
      # event names the test "<pkg>::<binary>$<path>"; the owning package is the
      # prefix before "::". This step both ASSERTS >0 executed (AC + test plan)
      # and PRINTS the per-package map #766 will consume.
      - name: "Trivial nextest run + per-package count source (sf-auth, >0 tests; pins #766)"
        env:
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON: "1"
        run: |
          set -euo pipefail
          # Run for real (exit code propagates: a test failure or zero-collection
          # under --no-tests=fail fails the step), capturing libtest-json NDJSON.
          cargo nextest run -p sf-auth --profile ci --no-tests=fail \
            --message-format libtest-json 2>/dev/null | tee nextest.jsonl
          python3 - <<'PY'
          import json, collections, sys
          executed = collections.Counter()
          with open("nextest.jsonl") as fh:
              for line in fh:
                  line = line.strip()
                  if not line.startswith("{"):
                      continue
                  try:
                      ev = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if ev.get("type") == "test" and ev.get("event") in ("ok", "failed"):
                      pkg = ev.get("name", "").split("::", 1)[0]
                      if pkg:
                          executed[pkg] += 1
          print("per-package executed-test counts (for #766 coverage-delta):")
          for pkg, n in sorted(executed.items()):
              print(f"  {pkg}: {n}")
          total = sum(executed.values())
          # LOUD fail: a green compile that executed 0 tests must not pass.
          if total <= 0:
              sys.exit("FAIL: 0 tests executed — exit 0 != tested")
          PY
