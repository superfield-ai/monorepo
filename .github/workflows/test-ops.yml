name: Ops Integration Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: test-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ops-integration:
    name: Ops integration (k3s + SSH loopback)
    runs-on: [self-hosted, linux]
    timeout-minutes: 25

    env:
      # Test environment name — secret/variable names use this suffix uppercased
      TEST_ENV: ci
      # Well-known BIP-39 test mnemonic (never used for real secrets).
      # doctor, deploy-env, rollback-env, and export-db all call readMnemonic()
      # which reads SUPERFIELD_MNEMONIC first, before prompting the TTY.
      SUPERFIELD_MNEMONIC: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
      # Repo under test (doctor uses this to list secrets via the GitHub API)
      TEST_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BLUEPRINT_SYNC_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install superfield CLI locally
        run: bun run local-install

      # -----------------------------------------------------------------------
      # Infrastructure setup
      # -----------------------------------------------------------------------
      - name: Set up test environment (k3s + SSH loopback + postgres)
        run: bash scripts/ci/ops-test-setup.sh
        # Exports to $GITHUB_ENV:
        #   DEPLOY_HOST       = 127.0.0.1
        #   DEPLOY_KEY_FILE   = /tmp/superfield-ops-test/id_ed25519
        #   DATABASE_URL_CI   = postgres://postgres:test@localhost:5432/superfield_ci
        #   KUBECONFIG        = /etc/rancher/k3s/k3s.yaml

      # -----------------------------------------------------------------------
      # Seed the mnemonic-derived SSH deploy key into authorized_keys.
      #
      # doctor's ssh-reachable check does:
      #   deriveEd25519Key(mnemonic, env, "ssh-deploy-key") → SSH to DEPLOY_HOST
      #
      # We need to add the pubkey derived from SUPERFIELD_MNEMONIC + env "ci"
      # into authorized_keys so the loopback SSH check actually passes.
      # -----------------------------------------------------------------------
      - name: Authorize mnemonic-derived deploy key for loopback SSH
        run: |
          node - <<'EOF'
          const { deriveEd25519Key } = require("@superfield/core");
          const mnemonic = Buffer.from(process.env.SUPERFIELD_MNEMONIC, "utf8");
          const { publicKeyOpenSsh } = deriveEd25519Key(mnemonic, "ci", "ssh-deploy-key");
          const { appendFileSync, mkdirSync } = require("fs");
          const { homedir } = require("os");
          const authKeys = `${homedir()}/.ssh/authorized_keys`;
          mkdirSync(`${homedir()}/.ssh`, { recursive: true });
          // Idempotent: only add if not already present
          const { readFileSync } = require("fs");
          let existing = "";
          try { existing = readFileSync(authKeys, "utf8"); } catch {}
          if (!existing.includes(publicKeyOpenSsh.trim())) {
            appendFileSync(authKeys, `\n${publicKeyOpenSsh}\n`);
            console.log("Added mnemonic-derived deploy key to authorized_keys");
          } else {
            console.log("Mnemonic-derived deploy key already in authorized_keys");
          }
          EOF

      # -----------------------------------------------------------------------
      # Seed GitHub repo secrets/variables that doctor reads via the API
      # -----------------------------------------------------------------------
      - name: Set GitHub repo secrets and variables for test env (ci)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # DEPLOY_HOST_CI is read as a *variable* (not secret) by doctor's
          # getDeployHost() function via GET /repos/{repo}/actions/variables/DEPLOY_HOST_CI
          gh variable set DEPLOY_HOST_CI --body "127.0.0.1" --repo "$TEST_REPO"

          # Secrets doctor checks for presence (GET /repos/{repo}/actions/secrets).
          # The values here are stubs — doctor only checks *existence*, not content.
          printf '%s' "$(cat /tmp/superfield-ops-test/id_ed25519)" \
            | gh secret set DEPLOY_KEY_CI --repo "$TEST_REPO"
          printf '%s' "$DATABASE_URL_CI" \
            | gh secret set DATABASE_URL_CI --repo "$TEST_REPO"
          printf '%s' "test-webhook-secret-ci" \
            | gh secret set WEBHOOK_SECRET_CI --repo "$TEST_REPO"
          printf '%s' "test-cookie-secret-ci" \
            | gh secret set COOKIE_SECRET_CI --repo "$TEST_REPO"

      # -----------------------------------------------------------------------
      # superfield doctor
      # -----------------------------------------------------------------------
      - name: Run superfield doctor (env=ci)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          superfield doctor --env ci --repo "$TEST_REPO" --json \
            | tee /tmp/doctor-output.json

          # Verify checks individually — allow secret-fingerprints to fail
          # (fingerprint _FP variables won't be set for stub secrets above)
          # and ssh-reachable (depends on derived key matching authorized_keys).
          # Hard-fail on infrastructure checks that should always pass.
          node -e "
            const r = JSON.parse(require('fs').readFileSync('/tmp/doctor-output.json'));
            console.log('Doctor report:');
            r.checks.forEach(c => console.log(\`  [\${c.ok ? 'PASS' : 'FAIL'}] \${c.name}: \${c.detail}\`));
            const allowedFail = new Set(['secret-fingerprints']);
            const hardFailed = r.checks.filter(c => !c.ok && !allowedFail.has(c.name));
            if (hardFailed.length) {
              console.error('Hard-failed checks:', JSON.stringify(hardFailed, null, 2));
              process.exit(1);
            }
            console.log('Doctor: all hard checks passed (allOk=' + r.allOk + ')');
          "

      # -----------------------------------------------------------------------
      # superfield deploy-env (dry-run)
      #
      # deploy-env reads DEPLOY_HOST and DEPLOY_KEY (or DEPLOY_KEY_FILE) from
      # the process environment — not env-suffixed. The setup step exports
      # DEPLOY_HOST and DEPLOY_KEY_FILE to $GITHUB_ENV.
      # -----------------------------------------------------------------------
      - name: Run superfield deploy-env (dry-run)
        run: |
          superfield deploy-env \
            --env ci \
            --repo "$TEST_REPO" \
            --app-name test-app \
            --tag "sha-$(git rev-parse --short HEAD)" \
            --dry-run
        # DEPLOY_HOST and DEPLOY_KEY_FILE are set in env by setup step.
        # dry-run exercises argument parsing and pre-flight without touching k3s.

      # -----------------------------------------------------------------------
      # superfield export-db
      #
      # export-db reads DEPLOY_HOST and DEPLOY_KEY (or DEPLOY_KEY_FILE) from
      # the process environment and connects to the postgres container via SSH.
      # -----------------------------------------------------------------------
      - name: Run superfield export-db
        run: |
          superfield export-db \
            --env ci \
            --repo "$TEST_REPO" \
            --out /tmp/superfield-ci-dump.sql
          [ -f /tmp/superfield-ci-dump.sql ] \
            || { echo "error: export-db did not create /tmp/superfield-ci-dump.sql"; exit 1; }
          echo "export-db output: $(du -h /tmp/superfield-ci-dump.sql | cut -f1)"

      # -----------------------------------------------------------------------
      # superfield rollback-env
      #
      # rollback-env has no --dry-run flag. It will attempt to kubectl rollout
      # undo on the k3s cluster. With no workload deployed it will fail, so we
      # allow non-zero exit. This still exercises argument parsing and env reading.
      # -----------------------------------------------------------------------
      - name: Run superfield rollback-env (best-effort)
        run: |
          superfield rollback-env \
            --env ci \
            --repo "$TEST_REPO" \
            --app-name test-app \
          || true
        # "|| true" because no deployment exists in the empty cluster.

      # -----------------------------------------------------------------------
      # superfield destroy
      #
      # destroy --yes skips the interactive prompt. Without real GCP infra it
      # will fail at the provider API call. We allow non-zero exit; the goal is
      # to verify the CLI parses correctly and runs the destroy path.
      # -----------------------------------------------------------------------
      - name: Run superfield destroy (best-effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          superfield destroy \
            --env ci \
            --provider gcp \
            --repo "$TEST_REPO" \
            --yes \
          || true
        # "|| true" because no real GCP infrastructure is provisioned.

      # -----------------------------------------------------------------------
      # Teardown (always runs)
      # -----------------------------------------------------------------------
      - name: Tear down test environment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci/ops-test-teardown.sh

          # Remove mnemonic-derived key from authorized_keys
          node - <<'EOF' || true
          const { deriveEd25519Key } = require("@superfield/core");
          const mnemonic = Buffer.from(
            "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about",
            "utf8"
          );
          const { publicKeyOpenSsh } = deriveEd25519Key(mnemonic, "ci", "ssh-deploy-key");
          const { readFileSync, writeFileSync } = require("fs");
          const { homedir } = require("os");
          const authKeys = `${homedir()}/.ssh/authorized_keys`;
          try {
            const lines = readFileSync(authKeys, "utf8").split("\n");
            const filtered = lines.filter(l => !l.includes(publicKeyOpenSsh.trim().split(" ")[1]));
            writeFileSync(authKeys, filtered.join("\n"));
            console.log("Removed mnemonic-derived deploy key from authorized_keys");
          } catch (e) {
            console.log("Could not clean authorized_keys:", e.message);
          }
          EOF

          # Remove test secrets and variables from the repo
          gh variable delete DEPLOY_HOST_CI   --repo "$TEST_REPO" 2>/dev/null || true
          gh secret  delete DEPLOY_KEY_CI     --repo "$TEST_REPO" 2>/dev/null || true
          gh secret  delete DATABASE_URL_CI   --repo "$TEST_REPO" 2>/dev/null || true
          gh secret  delete WEBHOOK_SECRET_CI --repo "$TEST_REPO" 2>/dev/null || true
          gh secret  delete COOKIE_SECRET_CI  --repo "$TEST_REPO" 2>/dev/null || true
