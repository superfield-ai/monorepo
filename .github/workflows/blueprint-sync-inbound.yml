name: Blueprint sync — inbound

# Pulls changes from dot-matrix-labs/calypso-blueprint into blueprint/
#
# Triggers:
#   - Daily at 02:00 UTC
#   - repository_dispatch from calypso-blueprint (event: blueprint-updated)
#   - Manual via workflow_dispatch

on:
  schedule:
    - cron: "0 2 * * *"
  repository_dispatch:
    types: [blueprint-updated]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BLUEPRINT_SYNC_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "superfield-bot"
          git config user.email "bot@superfield.dev"

      - name: Pull blueprint subtree
        run: |
          git subtree pull \
            --prefix=blueprint \
            https://x-access-token:${{ secrets.BLUEPRINT_SYNC_TOKEN }}@github.com/dot-matrix-labs/calypso-blueprint.git \
            main \
            --squash \
            -m "chore(blueprint): sync from calypso-blueprint"

      - name: Push if changed
        run: git push origin main
