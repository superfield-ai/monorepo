name: Studio CI

on:
  push:
    branches: [main, cli-migration]
    paths:
      - "packages/studio/**"
      - "packages/studio-core/**"
      - "packages/db/**"
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths:
      - "packages/studio/**"
      - "packages/studio-core/**"
      - "packages/db/**"
    paths-ignore:
      - "**/*.md"
  workflow_call:

concurrency:
  group: ci-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-build-typecheck:
    name: Studio build + typecheck
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BLUEPRINT_SYNC_TOKEN }}
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit --project packages/studio/tsconfig.json
      - name: Unit tests
        run: bun --bun vitest run packages/studio/tests/unit

  studio-browser-e2e:
    name: Studio browser E2E tests
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BLUEPRINT_SYNC_TOKEN }}
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Build studio web app
        run: bun run build:studio-web
      - name: E2E tests (real studio server + superfield fixture, no k3d)
        run: bun run test:e2e:studio

  studio-integration:
    name: Studio integration tests
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: calypso
          POSTGRES_PASSWORD: calypso
          POSTGRES_DB: calypso
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BLUEPRINT_SYNC_TOKEN }}
      - run: bun install --frozen-lockfile
      - name: Integration tests (in-process superfield fixture, no k3d)
        run: |
          for f in packages/studio/tests/integration/*.test.ts; do
            bun --bun vitest run "$f" || exit 1
          done
        env:
          DATABASE_URL: postgres://calypso:calypso@postgres:5432/calypso
