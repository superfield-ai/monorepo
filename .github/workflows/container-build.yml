name: Container build

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "blueprint"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "blueprint"

permissions:
  contents: read
  packages: write

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and build container image
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/superfield-cli
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BLUEPRINT_SYNC_TOKEN }}

      - run: bun install --frozen-lockfile

      - name: Compile native binaries (amd64 + arm64)
        env:
          SUPERFIELD_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          SUPERFIELD_BUILD_COMMIT: ${{ github.sha }}
        run: |
          export SUPERFIELD_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export SUPERFIELD_BUILD_BLUEPRINT_COMMIT="$(git -C blueprint rev-parse --short HEAD)"
          bun run --cwd packages/cli build:compile:all

      - name: Smoke test compiled binary
        run: |
          ./packages/cli/dist/superfield-linux-amd64 --help | head -n 5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          tags="${IMAGE}:sha-${GITHUB_SHA}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build (and push on tag) multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: packages/cli
          file: packages/cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          tags: ${{ steps.tags.outputs.tags }}
