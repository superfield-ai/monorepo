name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-unit:
    uses: ./.github/workflows/test-unit.yml
    secrets: inherit

  build:
    name: Build release binaries
    runs-on: [self-hosted, Linux, X64]
    needs: test-unit
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BLUEPRINT_SYNC_TOKEN }}

      - run: bun install --frozen-lockfile

      - name: Build all platform binaries
        run: |
          SUPERFIELD_BUILD_VERSION="${GITHUB_REF_NAME#v}" \
          SUPERFIELD_BUILD_COMMIT="${GITHUB_SHA}" \
          SUPERFIELD_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          SUPERFIELD_BUILD_BLUEPRINT_COMMIT="$(git -C blueprint rev-parse --short HEAD)" \
          bun run --filter @superfield/cli build:compile:all

      - name: Smoke test (linux-amd64)
        run: |
          chmod +x packages/cli/dist/superfield-linux-amd64
          help_output="$(packages/cli/dist/superfield-linux-amd64 --help)"
          printf '%s\n' "$help_output"
          printf '%s\n' "$help_output" | grep -F "Version: ${GITHUB_REF_NAME#v}"
          printf '%s\n' "$help_output" | grep -F "Commit: ${GITHUB_SHA}"
          printf '%s\n' "$help_output" | grep -F "Blueprint: $(git -C blueprint rev-parse --short HEAD)"
          printf '%s\n' "$help_output" | grep -F "Build date:"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/cli/dist/superfield-linux-amd64
            packages/cli/dist/superfield-linux-arm64
            packages/cli/dist/superfield-darwin-amd64
            packages/cli/dist/superfield-darwin-arm64
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
