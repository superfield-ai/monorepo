name: Quality gate

# Lint, format check, typecheck, and the harness's own unit tests. No
# Postgres, no Docker — fast feedback that prevents broken harness internals
# from slipping into a differential run.

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - '**/*.md'
      - .agents/**
      - .claude/**
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/**
      - '**/*.md'
      - .agents/**
      - .claude/**
  workflow_dispatch:
  workflow_call:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Harness unit tests
        env:
          # Skip the Postgres canary in this job — it has its own workflow.
          SHARP_TEST_SKIP_PG: '1'
        run: bun --bun vitest run tests/harness
