name: Integration Tests

on:
  workflow_dispatch:

jobs:
  test-integration:
    name: Integration (API) tests
    runs-on: ubuntu-latest
    container: oven/bun:1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BLUEPRINT_SYNC_TOKEN }}
      - run: bun install --frozen-lockfile
      - run: bun --bun vitest run packages/*/tests/integration
