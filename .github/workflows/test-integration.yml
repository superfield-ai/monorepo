name: Integration Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: test-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-integration:
    name: Integration (API) tests
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - run: bun install --frozen-lockfile
      - run: bun --bun vitest run packages/*/tests/integration
