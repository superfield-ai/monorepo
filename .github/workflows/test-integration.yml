name: Integration Tests

# THROTTLED on branch ci/debug-control-e2e: manual-only while we iterate on
# the Control browser E2E job. Restore push/pull_request before merging.
on:
  workflow_dispatch:

concurrency:
  group: test-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-integration:
    name: Integration (API) tests
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BLUEPRINT_SYNC_TOKEN }}
      - run: bun install --frozen-lockfile
      - run: bun --bun vitest run packages/*/tests/integration
