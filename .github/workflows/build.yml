name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "blueprint"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "blueprint"
      - ".github/workflows/**"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: bun install --frozen-lockfile
      - run: bun run lint

  format:
    name: Format
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  coverage-truth:
    name: Coverage truth
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The validator needs a TOML parser. tomllib is stdlib on Python >= 3.11;
      # for older images fall back to the tomli backport. Installing here keeps
      # the check self-sufficient and makes the parser hard-fail (never a silent
      # skip) impossible to trip on a missing dependency.
      - name: Ensure a TOML parser is available
        run: |
          if python3 -c 'import tomllib' 2>/dev/null; then
            echo "tomllib (stdlib) available"
          elif python3 -c 'import tomli' 2>/dev/null; then
            echo "tomli backport available"
          else
            python3 -m pip install --quiet tomli \
              || pip3 install --quiet tomli \
              || pip install --quiet tomli
          fi
      - name: Validate executed-coverage truth table
        run: scripts/check-coverage-truth.sh
      - name: Self-test the coverage-truth validator
        run: tests/coverage-truth-selftest.sh
      # Subsystem-test-job-presence guardrail (issue #767): every executed
      # subsystem must run in a REQUIRED status context and each language present
      # must have a required executing job. Runs in this existing required job so
      # it is satisfiable on every PR shape (no new required context — blocker
      # #753); the self-test proves it actually rejects a missing/non-required
      # job (loud, never silently skipped).
      - name: Assert every subsystem has a required executing test job
        run: scripts/check-test-job-presence.sh
      - name: Self-test the test-job-presence guardrail
        run: tests/test-job-presence-selftest.sh
      # Required-status-bypass mechanism (issue #788): assert the
      # required-status-contexts.txt <-> workflow mapping is in lockstep and the
      # docs-only / workflow-only / code skip decision is correct. Runs in this
      # existing required job so the bypass logic is covered on every code PR
      # (the self-test needs PyYAML; the CI image ships it, else the reporter
      # workflow installs it the same way).
      - name: Validate the required-status-bypass mapping
        run: python3 scripts/skipped-required-contexts.py --validate
      - name: Self-test the required-status-bypass decision
        run: tests/skipped-required-contexts-selftest.sh
# 790 workflow-only fixture: prove Coverage-truth satisfiable on workflow-only PRs