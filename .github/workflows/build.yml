name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

jobs:
  typecheck:
    name: Typecheck
    runs-on: [self-hosted, Linux, X64]
    container:
      image: mcr.microsoft.com/devcontainers/base:bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: [self-hosted, Linux, X64]
    container:
      image: mcr.microsoft.com/devcontainers/base:bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  format:
    name: Format
    runs-on: [self-hosted, Linux, X64]
    container:
      image: mcr.microsoft.com/devcontainers/base:bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  blueprint-freshness:
    name: Blueprint freshness
    runs-on: [self-hosted, Linux, X64]
    container:
      image: mcr.microsoft.com/devcontainers/base:bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check blueprint freshness
        run: bun run blueprint:compile && git diff --exit-code packages/core/blueprint-data.generated.ts
