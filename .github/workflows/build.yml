name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: [self-hosted, linux]
    container: oven/bun:1
    steps:
      - uses: actions/checkout@v4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: [self-hosted, linux]
    container: oven/bun:1
    steps:
      - uses: actions/checkout@v4
      - run: bun install --frozen-lockfile
      - run: bun run lint

  format:
    name: Format
    runs-on: [self-hosted, linux]
    container: oven/bun:1
    steps:
      - uses: actions/checkout@v4
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  blueprint-freshness:
    name: Blueprint freshness
    runs-on: [self-hosted, linux]
    container: oven/bun:1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BLUEPRINT_SYNC_TOKEN }}
      - run: bun install --frozen-lockfile
      - name: Check blueprint freshness
        run: bun run blueprint:compile && git diff --exit-code packages/core/blueprint-data.generated.ts
