name: Eval — todo-app

# Per-scenario Tier-2 eval (issue #748). Drives the WHOLE gardening loop against
# a live model — OpenCode's free Big Pickle (GLM-4.6) — driven **keylessly**
# through the `opencode` CLI: a fresh install reaches the free model with NO API
# key and NO login, so this needs no repo secret. The run is slow, stochastic,
# and reaches an external service, which under the CI taxonomy makes it `heavy`:
# sweep-only, never a PR gate. It runs ONLY on explicit manual dispatch
# (`workflow_dispatch`) — there is no `pull_request`, no `schedule`, and no
# `push` trigger, so it never fires on a commit, merge, or nightly cron.
env:
  CI_CLASS: heavy

on:
  workflow_dispatch:
    inputs:
      turn_budget:
        description: "Max gardening turns before giving up"
        required: false
        # The live observer flushes result.json with the DETERMINISTIC rungs
        # (seed + ingest + semantic-search) up front, then observes the live loop
        # under this turn budget AND a wall-clock deadline (SF_EVAL_DEADLINE_SECS
        # below). Artifact emission no longer depends on the live loop converging
        # within the cap (issue #780), so this budget only bounds how many live
        # turns are scored. The free Big Pickle model is slow on the saturated
        # self-hosted runner; keep the default small. Raise it for a longer
        # scoring sweep.
        default: "8"

concurrency:
  group: eval-todo-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-todo-app:
    name: todo-app scenario (live, keyless Big Pickle via opencode)
    runs-on: [self-hosted, Linux, X64]
    # The keyless free Big Pickle model is slow and the self-hosted runner is
    # queue-saturated. The live observer (`sf-eval`) flushes result.json with the
    # deterministic rungs up front and then stops on its own wall-clock deadline
    # (SF_EVAL_DEADLINE_SECS) — well inside this job wall — so the artifact is
    # produced regardless of whether the live loop converges. This wall is a hard
    # backstop, not the normal exit (issue #780).
    timeout-minutes: 75
    # The self-hosted runner forbids container-less jobs. Run inside the shared
    # CI image; the Postgres service is then reachable at host `postgres`.
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    services:
      postgres:
        # pgvector/pgvector:pg16 ships the `vector` extension the nexum schema
        # migration requires (the appliance boot runs every migration).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: superfield
          POSTGRES_PASSWORD: superfield
          POSTGRES_DB: superfield
        options: >-
          --health-cmd "pg_isready -U superfield"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        shell: bash
    env:
      # Keyless: the loop drives the free Big Pickle model through a local
      # `opencode serve`, which on a fresh install needs no API key and no login.
      # NO repo secret is referenced anywhere in this workflow.
      SF_LLM_PROVIDER: opencode-server
      SF_LLM_MODEL: opencode/big-pickle
      SF_OPENCODE_SERVER: http://127.0.0.1:4096
      # Shared Postgres for the appliance (boot migrates it) and the observer.
      # Host is the service name `postgres` because the job runs in a container.
      DATABASE_URL: postgres://superfield:superfield@postgres:5432/superfield
      TURN_BUDGET: ${{ github.event.inputs.turn_budget || '60' }}
      # Wall-clock backstop for the live observer. result.json (with the
      # deterministic rungs) is flushed within seconds of the observer starting;
      # this only bounds how long it then waits for live-LLM turns before
      # stopping cleanly and letting the upload step run — well under the 75-min
      # job wall so the artifact is never lost to a mid-flight kill (issue #780).
      SF_EVAL_DEADLINE_SECS: "1200"
      # A fixed, valid UUID so the seed, the loop, and the observer share one
      # workspace.
      WORKSPACE_ID: 00000000-0000-4000-8000-000000000748
      SF_NO_DAEMON: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the eval results + log directory
        # Every process log (appliance, opencode server, scenario) and the
        # harness work products are written under the results tree so the single
        # `evals/results/todo-app/**` upload retains them all. Create the `_logs`
        # dir up front so the boot/server steps can redirect into it.
        run: mkdir -p evals/results/todo-app/_logs

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install C toolchain (required by Rust build scripts)
        # The ci-runner image ships python3 + curl but no C compiler; cargo's
        # build scripts need a linker (`cc`) or every crate fails with
        # "linker `cc` not found". Mirrors the install step in ci-control.yml.
        run: apt-get update -y && apt-get install -y --no-install-recommends gcc libc6-dev pkg-config libssl-dev

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── Make the governed embed weights present OFFLINE (Mechanism A) ───────
      # The garden Seed step below (`cargo run --bin superfield -- garden`)
      # constructs Embedder::new(), which resolves the all-MiniLM-L6-v2 weights
      # cache-first then falls through to a network download() on a miss. On a
      # no-egress runner that download produces `RelativeUrlWithoutBase` — the
      # Seed failure this issue (#762) fixes. This shared composite action
      # (#760) restores the hf-hub cache tree keyed on models/embedding.lock, or
      # on a miss does ONE online curl-based populate, then asserts the exact
      # refs/<rev> + snapshots/<full-sha>/ layout exists (failing LOUDLY if not)
      # and runs the offline-resolution probe. It exports HF_HOME to $GITHUB_ENV
      # so the Seed step below resolves the weights cache-HIT branch with zero
      # huggingface.co egress. Runs before the build/boot/Seed steps. The C
      # toolchain (above) and Cargo cache (above) are already in place, which
      # the action's offline probe (cargo test -p nexum) needs.
      - name: Provision governed embed weights (offline)
        uses: ./.github/actions/governed-embed-weights

      - name: Install the keyless opencode CLI
        run: |
          set -euo pipefail
          # A fresh opencode install drives the free Big Pickle model with no
          # login. The official installer drops the binary in ~/.opencode/bin.
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Start the keyless opencode server
        run: |
          set -euo pipefail
          opencode --version
          # `opencode serve` exposes the session API (POST /session, then
          # /session/{id}/message) that the loop's keyless executor drives. A
          # fresh install reaches the free Big Pickle model with no API key and
          # no login — no credential is configured here.
          nohup opencode serve --port 4096 \
            >evals/results/todo-app/_logs/opencode-server.log 2>&1 &
          echo "OPENCODE_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4096/api/health" >/dev/null 2>&1; then
              echo "opencode server up after ${i}s"; break
            fi
            sleep 1
          done

      - name: Verify the keyless model is reachable
        run: |
          set -euo pipefail
          # One keyless round-trip through the session API proves the free model
          # answers with no credential — the same server API the loop drives via
          # SF_OPENCODE_SERVER. The CI image ships python3 and curl but NOT jq,
          # so parse the JSON with the python stdlib. Fail if the text is empty.
          SID=$(curl -fsS -X POST "http://127.0.0.1:4096/session?directory=$PWD" \
            -H 'content-type: application/json' -d '{}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          TEXT=$(curl -fsS -X POST "http://127.0.0.1:4096/session/$SID/message" \
            -H 'content-type: application/json' --max-time 120 \
            -d '{"model":{"providerID":"opencode","modelID":"big-pickle"},"parts":[{"type":"text","text":"Reply with the single word READY."}]}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("".join(p.get("text","") for p in d.get("parts",[]) if p.get("type")=="text"))')
          echo "keyless model replied: '${TEXT}'"
          test -n "${TEXT}" || { echo "keyless opencode model returned no text" >&2; exit 1; }

      - name: Build the appliance and the eval harness
        run: |
          # The appliance binary lives in the `superfield` package; the eval
          # harness is the `sf-eval` bin in the `sf-eval` package. Build each
          # with the same invocation the later run steps use, so this pre-warms
          # the cache rather than failing on a cross-package --bin lookup.
          cargo build --bin superfield
          cargo build -p sf-eval --bin sf-eval

      - name: Boot the appliance (health-gated provision, migrate, serve, loop)
        run: |
          set -euo pipefail
          # SF_START_DAEMON enters the health-gated boot; with an external
          # DATABASE_URL it uses the no-op provisioner, runs migrations, then
          # serves and starts the gardening loop. SF_NO_DAEMON keeps it in the
          # foreground so we can background it here and capture its log.
          #
          # RUST_LOG raises the appliance's verbosity so the gardening loop's
          # per-turn activity is actually recorded: `superfield serve` installs an
          # env-filtered tracing subscriber, so `sf_loop` (the loop engine + the
          # LLM agent executor in `sf_loop::agent`) emits per-step + per-LLM-call
          # lines at debug, while the noisy transport crates stay at warn. Without
          # this, the loop's `tracing::info!`/`debug!` events have no subscriber
          # and are dropped — appliance.log would show nothing of the live LLM I/O.
          export RUST_LOG="info,sf_loop=debug,sf_serve=info,nexum=info,sqlx=warn,hyper=warn,hyper_util=warn,reqwest=warn,h2=warn"
          SF_START_DAEMON=1 cargo run --bin superfield -- serve \
            >evals/results/todo-app/_logs/appliance.log 2>&1 &
          echo "APPLIANCE_PID=$!" >> "$GITHUB_ENV"
          # Wait for the HTTP layer to bind (boot migrates first, so this also
          # gates on a migrated DB).
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:7000/healthz" >/dev/null 2>&1 \
               || curl -fsS "http://127.0.0.1:7000/" >/dev/null 2>&1; then
              echo "appliance up after ${i}0s"; break
            fi
            sleep 10
          done

      - name: Studio browser-smoke (capture + verdict)
        # Observed-not-gating browser leg for the todo-app eval (issue #815,
        # seams pinned by scout #829 in docs/scout/studio-browser-smoke-seams.md).
        # Drives the appliance's UNAUTHENTICATED render surface — GET / , the
        # Studio placeholder page — with headless chromium and writes a
        # screenshot under the run dir. /studio/* is auth-gated (401) and there
        # is no built UI (no CONTROL_ASSETS_DIR set in this job), so GET / is the
        # only reachable render surface during the eval. The screenshot lands
        # under the existing `evals/results/todo-app/**` upload prefix (issue
        # #814), so retention needs no further change.
        #
        # HONEST EXECUTION (test-coverage policy — loud, never silent). The
        # `browser_smoke` verdict stamped into result.json is DRIVEN BY the
        # actual capture, not hardcoded: it is `pass` ONLY when chromium is
        # present, GET / answers 200, and a NON-EMPTY PNG lands on disk. Any of
        # those failing records `fail` — never the pre-existing `skipped`
        # (silent) and never a false `pass`. The leg is observed, not gating
        # (evals/scenarios/todo-app/acceptance.md), so a `fail` verdict is
        # surfaced loudly in result.json + the uploaded artifact rather than
        # aborting the eval. The verdict propagates to the sf-eval observer via
        # $GITHUB_ENV (read once at observer start — crates/sf-eval/src/main.rs),
        # which is why this step runs BEFORE `Run the todo-app scenario`.
        #
        # chromium is installed at step time via apt (the ci-runner image ships
        # only python3 + curl — no node/Playwright/chromium), mirroring the
        # C-toolchain install step above. This uses chromium's OWN headless
        # --screenshot CLI: no node, so issue #810's node-injection problem stays
        # closed, and the ci-runner image build is untouched.
        run: |
          set -uo pipefail
          SHOT_DIR="evals/results/todo-app/${WORKSPACE_ID}"
          SHOT="${SHOT_DIR}/studio-smoke.png"
          URL="http://127.0.0.1:7000/"
          # The producer runs before sf-eval creates the run dir, so make it.
          mkdir -p "${SHOT_DIR}"

          # Any failure below records an executed `fail` verdict (loud, visible
          # in result.json + the artifact) and returns cleanly — observed, not
          # gating. It NEVER leaves the verdict at the silent default `skipped`.
          fail() {
            echo "browser-smoke FAILED: $1" >&2
            echo "SF_EVAL_BROWSER_SMOKE=fail" >> "$GITHUB_ENV"
            exit 0
          }

          # 1. Install chromium at step time. If apt cannot reach a chromium
          #    package that is a real image/runner gap (file an image-change
          #    request) — surfaced as a loud `fail`, never a silent skip.
          apt-get update -y || fail "apt-get update failed (cannot install chromium)"
          apt-get install -y --no-install-recommends chromium \
            || apt-get install -y --no-install-recommends chromium-browser \
            || fail "could not install chromium via apt (image/runner gap)"

          # 2. Resolve the binary (Debian: `chromium`; some bases `chromium-browser`).
          CHROMIUM=""
          for c in chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then CHROMIUM="$c"; break; fi
          done
          [ -n "${CHROMIUM}" ] || fail "no chromium binary on PATH after install"
          echo "using headless driver: $(command -v "${CHROMIUM}")"

          # 3. Reachability gate: the render surface must answer 200 before capture.
          curl -fsS "${URL}" >/dev/null || fail "GET ${URL} did not answer 200 (Studio surface unreachable)"

          # 4. Headless capture. --no-sandbox is required in the unprivileged container.
          "${CHROMIUM}" --headless=new --no-sandbox --disable-gpu \
            --window-size=1280,800 \
            --screenshot="${SHOT}" \
            "${URL}" || fail "headless chromium screenshot capture errored"

          # 5. Executed evidence: assert a NON-EMPTY PNG landed on disk.
          test -s "${SHOT}" || fail "screenshot ${SHOT} missing or empty after capture"

          echo "browser-smoke PASS: captured $(wc -c <"${SHOT}") bytes to ${SHOT}"
          echo "SF_EVAL_BROWSER_SMOKE=pass" >> "$GITHUB_ENV"

      - name: Seed the todo-app intent
        run: |
          set -euo pipefail
          cargo run --bin superfield -- garden \
            evals/scenarios/todo-app/seed/*.md \
            --workspace-id "${WORKSPACE_ID}"

      - name: Run the todo-app scenario (live runner, keyless)
        run: |
          set -euo pipefail
          # The live runner observes the running loop via DATABASE_URL. It first
          # computes the deterministic rungs (seed + ingest + semantic-search)
          # and flushes evals/results/todo-app/<workspace-id>/result.json, then
          # polls the gardening cursor — re-flushing each poll — until acceptance,
          # the turn budget, or SF_EVAL_DEADLINE_SECS. So result.json is uploaded
          # regardless of whether the live-LLM loop converges (issue #780). A
          # broken deterministic floor (missing seed/embeds, embedder can't
          # retrieve) exits non-zero — loud, never a fake green.
          # tee the observer's stdout+stderr to scenario.log so the deterministic
          # rung verdicts and the per-poll observer trace are retained in the
          # uploaded results tree, not just the (truncated) live CI log. pipefail
          # keeps the runner's exit status authoritative through the pipe.
          cargo run -p sf-eval --bin sf-eval -- \
            run \
            --scenario evals/scenarios/todo-app \
            --turn-budget "${TURN_BUDGET}" \
            --workspace-id "${WORKSPACE_ID}" \
            2>&1 | tee evals/results/todo-app/_logs/scenario.log

      - name: Stop the appliance and the opencode server
        if: always()
        run: |
          if [ -n "${APPLIANCE_PID:-}" ]; then kill "${APPLIANCE_PID}" 2>/dev/null || true; fi
          if [ -n "${OPENCODE_PID:-}" ]; then kill "${OPENCODE_PID}" 2>/dev/null || true; fi
          echo "--- appliance.log (tail) ---"
          tail -n 100 evals/results/todo-app/_logs/appliance.log 2>/dev/null || true
          echo "--- opencode-server.log (tail) ---"
          tail -n 40 evals/results/todo-app/_logs/opencode-server.log 2>/dev/null || true

      - name: Upload the eval results tree (result.json + work products + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-todo-app-result-${{ github.run_id }}
          # Upload the WHOLE results tree, not just result.json: the persisted
          # work products (project-graph.md, candidate-*.{json,diff}, turns.json
          # written by sf-eval) and the captured process logs under `_logs/`
          # (appliance.log, opencode-server.log, scenario.log) all live under
          # this prefix, so a run is auditable after the fact. `if: always()`
          # plus the runner's incremental result.json flush keep the artifact on
          # a deadline/timeout/failure too (issue #780). A screenshot, once a
          # browser-smoke step produces one here, would upload under this prefix
          # with no further change.
          path: evals/results/todo-app/**
          if-no-files-found: warn
          retention-days: 30
