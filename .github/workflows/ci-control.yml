# =============================================================================
# Control CI
# -----------------------------------------------------------------------------
# Guards the Studio Control Plane on every PR that touches its source.
#
# Scope: code under `packages/control` (the React browser UI assets),
# `packages/control-core` (shared protocol types), `crates/sf-serve` (the
# Rust HTTP backend that replaces the retired Bun server), and `packages/db`.
#
# Two independent jobs run in parallel; both must pass:
#
#   1. control-browser-e2e — Builds the studio React webapp, compiles the
#      Rust sf-serve binary, then boots the real `superfield serve` binary
#      against a Postgres service and drives it with Playwright/Chromium.
#      Verifies the wire contract between the React app and the Rust backend:
#      tab navigation, debug view, deploy view, error envelopes, a11y smoke,
#      console cleanliness (see tests/e2e/fixtures.ts — no console.error /
#      .warn is allowed). Does NOT require a real cluster (no k3d/kubectl);
#      cluster-status SSE poller failures are expected and harmless.
#
#   2. control-unit — Fast unit tests for the browser UI components.
#
# The Bun/Node control server (packages/control/src/) and its unit +
# integration test suites were retired in issue #452.  All serving is now
# handled by the Rust sf-serve crate.
#
# The template-side counterpart lives in ci-control-template.yml.
# =============================================================================
name: Control CI

on:
  push:
    branches: [main, cli-migration]
    paths:
      - "packages/control/**"
      - "packages/control-core/**"
      - "packages/db/**"
      - "crates/sf-serve/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/control/**"
      - "packages/control-core/**"
      - "packages/db/**"
      - "crates/sf-serve/**"
  workflow_call:

concurrency:
  group: ci-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Browser E2E against the Rust sf-serve backend.
  # Builds the studio React app and the Rust superfield binary, boots the
  # server against a live Postgres, then runs Playwright/Chromium specs.
  #
  # The auto-fixture in tests/e2e/fixtures.ts fails any spec that emits a
  # console.error / .warn from app code — no surprises in the browser console.
  # ---------------------------------------------------------------------------
  control-browser-e2e:
    name: Control browser E2E (Rust backend)
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superfield
          POSTGRES_PASSWORD: superfield
          POSTGRES_DB: superfield
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BLUEPRINT_SYNC_TOKEN }}
      - run: bun install --frozen-lockfile
      - name: Install Playwright chromium browser
        run: bun x playwright install chromium
      - name: Build control web app
        run: bun run build:control-web
      - name: Build Rust superfield binary
        run: cargo build -p superfield --release
      - name: E2E tests (Rust sf-serve backend + Postgres)
        run: bun run test:e2e:control
        env:
          DATABASE_URL: postgres://superfield:superfield@postgres:5432/superfield
          SF_SERVE_BIN: ./target/release/superfield

  # ---------------------------------------------------------------------------
  # Job 2: Browser UI unit tests (Vitest + jsdom, no server required).
  # ---------------------------------------------------------------------------
  control-unit:
    name: Control UI unit tests
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BLUEPRINT_SYNC_TOKEN }}
      - run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun --bun vitest run packages/control/apps/tests
