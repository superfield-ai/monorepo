name: Control CI

on:
  push:
    branches: [main, cli-migration]
    paths:
      - "packages/control/**"
      - "packages/control-core/**"
      - "packages/db/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/control/**"
      - "packages/control-core/**"
      - "packages/db/**"
  workflow_call:

concurrency:
  group: ci-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-build-typecheck:
    name: Control build + typecheck
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BLUEPRINT_SYNC_TOKEN }}
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit --project packages/control/tsconfig.json
      - name: Unit tests
        run: bun --bun vitest run packages/control/tests/unit

  control-browser-e2e:
    name: Control browser E2E tests
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BLUEPRINT_SYNC_TOKEN }}
      - run: bun install --frozen-lockfile
      - name: Build control web app
        run: bun run build:control-web
      - name: E2E tests (real control server + superfield fixture, no k3d)
        run: bun run test:e2e:control

  control-integration:
    name: Control integration tests
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superfield
          POSTGRES_PASSWORD: superfield
          POSTGRES_DB: superfield
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BLUEPRINT_SYNC_TOKEN }}
      - run: bun install --frozen-lockfile
      - name: Integration tests (in-process superfield fixture, no k3d)
        run: |
          for f in packages/control/tests/integration/*.test.ts; do
            bun --bun vitest run "$f" || exit 1
          done
        env:
          DATABASE_URL: postgres://superfield:superfield@postgres:5432/superfield
