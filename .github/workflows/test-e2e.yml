name: E2E Deploy Tests

on:
  push:
    branches: [main]
    paths:
      - "packages/core/commands/deploy.ts"
      - "packages/cli/commands/deploy.ts"
      - "e2e/**"
      - ".github/workflows/test-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/core/commands/deploy.ts"
      - "packages/cli/commands/deploy.ts"
      - "e2e/**"
      - ".github/workflows/test-e2e.yml"
  workflow_dispatch:

concurrency:
  group: test-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: E2E deploy (k3d)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker
        run: docker version
      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - run: bun install --frozen-lockfile
      - name: Set host gateway for ingress probe
        run: |
          HOST_GW=$(python3 -c "
          with open('/proc/net/route') as f:
              for line in f:
                  p = line.split()
                  if len(p) > 2 and p[1] == '00000000':
                      h = p[2]
                      print('.'.join(str(int(h[i:i+2],16)) for i in [6,4,2,0]))
                      break
          ")
          echo "SUPERFIELD_DEMO_HOST=${HOST_GW}" >> "$GITHUB_ENV"
      - name: Run E2E tests
        run: bun --bun vitest run packages/*/tests/e2e
      - name: Dump pod state on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl describe pods || true
          kubectl logs -l app=postgres --tail=20 || true
          kubectl logs -l app=api-server --tail=20 || true
