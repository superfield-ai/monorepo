name: Unit Tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  test-unit:
    name: Unit tests
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ghcr.io/superfield-ai/ci-runner:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BLUEPRINT_SYNC_TOKEN }}
      - run: bun install --frozen-lockfile
      - run: bun --bun vitest run packages/*/tests/unit
