name: Unit Tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  test-unit:
    name: Unit tests
    runs-on: [self-hosted, linux]
    container: oven/bun:1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BLUEPRINT_SYNC_TOKEN }}
      - run: bun install --frozen-lockfile
      - run: bun --bun vitest run packages/*/tests/unit
