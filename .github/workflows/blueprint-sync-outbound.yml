name: Blueprint sync — outbound

# Pushes changes made to blueprint/ back to dot-matrix-labs/calypso-blueprint
#
# Triggers only when a push to main actually touches files under blueprint/

on:
  push:
    branches: [main]
    paths: ["blueprint/**"]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BLUEPRINT_SYNC_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "superfield-bot"
          git config user.email "bot@superfield.dev"

      - name: Push blueprint subtree to calypso-blueprint
        run: |
          git subtree push \
            --prefix=blueprint \
            https://x-access-token:${{ secrets.BLUEPRINT_SYNC_TOKEN }}@github.com/dot-matrix-labs/calypso-blueprint.git \
            main
