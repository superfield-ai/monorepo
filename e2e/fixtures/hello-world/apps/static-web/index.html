<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superfield E2E Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 30px 0;
    }
    .service-card {
      padding: 15px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      background: #f0f0f0;
      border: 2px solid #e0e0e0;
    }
    .service-card.ready {
      background: #d4edda;
      border-color: #28a745;
      color: #155724;
    }
    .counter-section {
      background: #f9f9f9;
      padding: 25px;
      border-radius: 8px;
      margin: 25px 0;
      text-align: center;
      border: 2px solid #e9ecef;
    }
    .counter-label {
      color: #666;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .counter-value {
      font-size: 48px;
      font-weight: bold;
      color: #667eea;
      font-variant-numeric: tabular-nums;
    }
    .status-text {
      font-size: 13px;
      color: #666;
      margin-top: 20px;
      line-height: 1.6;
    }
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #667eea;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error {
      background: #f8d7da;
      color: #721c24;
      border-color: #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✓ Superfield E2E Test</h1>
    <p class="subtitle">Multi-container deployment with inter-service networking</p>

    <div class="status-grid">
      <div class="service-card ready">postgres<br>Database</div>
      <div class="service-card ready">api-server<br>HTTP API</div>
      <div class="service-card ready">worker<br>Job Processor</div>
      <div class="service-card ready">static-web<br>Frontend</div>
    </div>

    <div class="counter-section">
      <div class="counter-label">Work Items Processed</div>
      <div class="counter-value">
        <span class="spinner"></span>
        <span id="counter">--</span>
      </div>
    </div>

    <div class="status-text" id="status">
      <span class="spinner"></span> Loading counter from API...
    </div>
  </div>

  <script>
    async function fetchCounter() {
      try {
        // Use hostname for internal API calls
        const apiUrl = `http://${window.location.hostname}:8080/counter`;
        console.log('Fetching from:', apiUrl);
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        return data.count;
      } catch (err) {
        console.error('Error fetching counter:', err);
        return null;
      }
    }

    async function updateCounter() {
      const count = await fetchCounter();
      const counterEl = document.getElementById('counter');
      const statusEl = document.getElementById('status');

      if (count !== null) {
        counterEl.textContent = count;
        statusEl.innerHTML = `✓ All services are operational. Worker processed ${count} task${count !== 1 ? 's' : ''}.`;
        counterEl.parentElement.parentElement.classList.remove('error');
      } else {
        counterEl.textContent = '?';
        statusEl.innerHTML = `⚠ Could not reach API server`;
        counterEl.parentElement.parentElement.classList.add('error');
      }
    }

    // Update immediately and then every 2 seconds
    updateCounter();
    setInterval(updateCounter, 2000);
  </script>
</body>
</html>
