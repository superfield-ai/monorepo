[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexum-area2-training-curriculum"
version = "0.1.0"
description = "Area 2 — Graph as Training Curriculum (H2.1–H2.4, Phase 3)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "datasets>=2.19.0",
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: mark test as slow (deselect with -m 'not slow')",
]
