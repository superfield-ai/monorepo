[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nexum-area7-differentiable-graph"
version = "0.1.0"
description = "Area 7 full run: differentiable graph model training, ONNX production, staleness curve, throughput comparison"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "numpy",
    "tqdm",
    "matplotlib",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout"]

[tool.setuptools.packages.find]
where = ["."]
