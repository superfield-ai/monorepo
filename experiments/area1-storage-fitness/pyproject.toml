[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "area1-storage-fitness"
version = "0.1.0"
description = "Area 1 — Storage Architecture Fitness (H1.1–H1.3, Phase 1A)"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9",
    "pgvector>=0.2.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "kuzu>=0.5.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.4.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
