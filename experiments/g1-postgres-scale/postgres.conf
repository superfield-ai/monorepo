# Nexum G1-OPT-1 recommended Postgres configuration
# Target: semantic ANN P99 < 200ms at 1M blocks on ≤4GB RAM deployments
#
# Apply with: ALTER SYSTEM SET <param> = '<value>'; SELECT pg_reload_conf();
# Or copy relevant lines into postgresql.conf and restart.

# ── Memory ────────────────────────────────────────────────────────────────────

# HNSW index for 1M × 384-dim float32 ≈ 600MB on disk.
# halfvec reduces that to ~300MB. Set shared_buffers to cover the index + table.
# Rule of thumb: 25% of RAM, minimum 512MB for pgvector workloads.
shared_buffers = 1GB          # raise from default 128MB; covers halfvec HNSW index

# Allow each ANN query to use up to 256MB for sort/hash operations.
work_mem = 256MB               # default 4MB is far too low for HNSW graph traversal

# Cache size hint for the planner — affects whether it chooses index scans.
# Set to ~50-75% of total RAM on dedicated DB nodes.
effective_cache_size = 3GB    # for a 4GB-RAM deployment

# ── pgvector ANN ──────────────────────────────────────────────────────────────

# ef_search: controls how many graph nodes are visited per ANN query.
# Higher → more recall, slower. Set to the knee value from ef_search_sweep.py.
# Default (40) is conservative; 80 gives better recall with <2× latency on warm cache.
# Set at session level via: SET hnsw.ef_search = 80;
# Set globally here for application default:
hnsw.ef_search = 80

# ── Parallelism ───────────────────────────────────────────────────────────────

# pgvector HNSW index scans are single-threaded (as of pgvector 0.7).
# Increasing max_parallel_workers does not help ANN queries.
# Keep defaults unless you have CPU-bound workloads elsewhere.

# ── Checkpoints / WAL ─────────────────────────────────────────────────────────

# Reduce checkpoint frequency during index builds to avoid I/O spikes.
checkpoint_completion_target = 0.9
max_wal_size = 2GB

# ── Logging ───────────────────────────────────────────────────────────────────

# Enable auto_explain to catch slow queries during development.
# Disable in production to avoid log volume.
# shared_preload_libraries = 'pg_stat_statements,auto_explain'
# auto_explain.log_min_duration = 200   # log queries slower than 200ms
# auto_explain.log_analyze = on
# auto_explain.log_buffers = on
