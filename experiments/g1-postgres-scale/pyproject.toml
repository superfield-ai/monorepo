[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "g1-postgres-scale"
version = "0.1.0"
description = "Gate G1 — Postgres scale floor benchmark for Nexum (H1.1, Phase 0 Spike B)"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9",
    "pgvector>=0.2.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "faker>=20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
