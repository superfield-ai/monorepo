[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "area6-gpu-acceleration"
version = "0.1.0"
description = "Area 6 — GPU acceleration for Postgres extensions (H6.2–H6.6, Phase 3)"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9",
    "pgvector>=0.2.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
gpu = [
    "torch",
    "faiss-gpu",
    "onnxruntime-gpu",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.pytest.ini_options.markers]
slow = "marks tests as slow (deselect with '-m \"not slow\"')"
gpu = "marks tests requiring CUDA hardware (skip with '-m \"not gpu\"')"
