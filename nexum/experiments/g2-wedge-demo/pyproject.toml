[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "g2-wedge-demo"
version = "0.1.0"
description = "Gate G2 wedge demo: Nexum provenance vs. vanilla RAG attribution F1"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "llama-index>=0.10.0",
    "llama-index-core",
    "numpy",
    "tqdm",
    "anthropic>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
