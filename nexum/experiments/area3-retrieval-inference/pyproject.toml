[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "area3-retrieval-inference"
version = "0.1.0"
description = "Area 3: Retrieval-augmented inference — latency floor, recency test, sparse attention ablation"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "numpy",
    "tqdm",
    "anthropic>=0.25.0",
    "llama-index>=0.10.0",
    "llama-index-core",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
