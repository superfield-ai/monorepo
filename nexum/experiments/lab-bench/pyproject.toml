[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nexum-lab-bench"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "beir>=2.0.0",
    "mteb>=1.14.0",
    "ogb>=1.3.6",
    "datasets>=2.19.0",
    "torch>=2.2.0",
    "sentence-transformers>=3.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "evaluate>=0.4.0",
    "pyarrow>=16.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpserver>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["adapters*", "eval*", "fixtures*"]
