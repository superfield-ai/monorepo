[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "area5-update-semantics"
version = "0.1.0"
description = "Area 5 — Update semantics and live consistency (H5.1–H5.5, Phase 2)"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9",
    "pgvector>=0.2.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "requests>=2.31",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.pytest.ini_options.markers]
slow = "marks tests as slow (deselect with '-m \"not slow\"')"
