name: experiments-harness

on:
  push:
    paths:
      - 'experiments/**'
      - 'scripts/update-hypothesis-status.sh'
      - 'scripts/lint-phase2-inference-client.mjs'
      - 'scripts/lint-phase1-age-cutover.mjs'
      - 'docs/research/methodology.md'
      - 'docs/research/hypotheses/**'
      - 'src/**'
      - 'docker/Dockerfile.gpu'
      - 'docker-compose.yml'
      - 'tests/unit/lint-phase2-inference-client.test.mjs'
      - '.github/workflows/experiments-harness.yml'
  pull_request:
    paths:
      - 'experiments/**'
      - 'scripts/update-hypothesis-status.sh'
      - 'scripts/lint-phase2-inference-client.mjs'
      - 'scripts/lint-phase1-age-cutover.mjs'
      - 'docs/research/methodology.md'
      - 'docs/research/hypotheses/**'
      - 'src/**'
      - 'docker/Dockerfile.gpu'
      - 'docker-compose.yml'
      - 'tests/unit/lint-phase2-inference-client.test.mjs'
      - '.github/workflows/experiments-harness.yml'

jobs:
  smoke:
    name: phase-0 harness smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest and harness deps
        run: python -m pip install --upgrade pip pytest numpy psycopg2-binary

      - name: Run harness pytest (100-block toy corpus smoke)
        run: python -m pytest experiments/_lib/tests/ -q

      - name: Run G1-OPT-1 diagnose_hnsw unit tests (db-free)
        run: python -m pytest experiments/g1-postgres-scale/tests/test_diagnose_hnsw.py -q

      - name: Run G1 core unit tests (db-free)
        run: python -m pytest experiments/g1-postgres-scale/tests/test_g1.py -q

      - name: Run G1 generate_corpus and schema unit tests (db-free, issue #135)
        run: python -m pytest experiments/g1-postgres-scale/tests/test_generate_corpus.py -q

      - name: Run H1.2 retrieval comparison unit tests (db-free, issue #138)
        run: python -m pytest experiments/area1-storage-fitness/tests/test_h12_retrieval.py -q

      - name: Smoke-test update-hypothesis-status.sh idempotency
        run: |
          set -euo pipefail
          cp docs/research/hypotheses/H1.1_postgres-sufficient-20m-blocks.md /tmp/H1.1_test.md
          SOURCE_DATE_EPOCH=1700000000 \
            scripts/update-hypothesis-status.sh \
              /tmp/H1.1_test.md passed \
              experiments/g1-postgres-scale/results/g1_test.json
          A=$(md5sum /tmp/H1.1_test.md | cut -d' ' -f1)
          SOURCE_DATE_EPOCH=1700000000 \
            scripts/update-hypothesis-status.sh \
              /tmp/H1.1_test.md passed \
              experiments/g1-postgres-scale/results/g1_test.json
          B=$(md5sum /tmp/H1.1_test.md | cut -d' ' -f1)
          if [[ "$A" != "$B" ]]; then
            echo "update-hypothesis-status.sh is not idempotent" >&2
            exit 1
          fi

      - name: Verify legacy g4 result still parseable
        run: |
          python -c "import json,sys; \
            p='experiments/g4-onnx-lossless/results/g4_result.json'; \
            d=json.load(open(p)); \
            assert d['gate']=='G4'; \
            assert 'pass' in d; \
            print('legacy g4 ok')"

  phase2-scout:
    name: phase-2 scout type-check + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: tsc --noEmit (inference-client interface compiles)
        run: npx tsc --noEmit

      - name: Build dist for tests
        run: npx tsc

      - name: Inference-client unit test (stub interface)
        run: node --test tests/unit/inference-client.test.mjs

      - name: LocalCpuInferenceClient unit tests (issue #105)
        run: node --test tests/unit/local-cpu-inference-client.test.mjs

      - name: Phase-2/3 inference-client lint unit tests (issue #107)
        run: node --test tests/unit/lint-phase2-inference-client.test.mjs

      - name: Phase-2 inference-client import lint
        run: node scripts/lint-phase2-inference-client.mjs

      - name: Phase-1 AGE-default cutover lint
        run: node scripts/lint-phase1-age-cutover.mjs

      - name: GPU Dockerfile spec exists
        run: test -f docker/Dockerfile.gpu
