---
# ClusterRole: read-only pod access across all namespaces.
# Required for kubectl cluster-info and kubectl get pods --watch --all-namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: studio-e2e-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding: grant pod-reader to ALL service accounts.
# This covers any test namespace without requiring namespace-specific RBAC.
# Acceptable for ephemeral E2E test clusters.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: studio-e2e-pod-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: studio-e2e-pod-reader
subjects:
  - kind: Group
    name: system:serviceaccounts
    apiGroup: rbac.authorization.k8s.io
