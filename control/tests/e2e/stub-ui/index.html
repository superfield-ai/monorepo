<!doctype html>
<!--
  tests/e2e/stub-ui/index.html

  Minimal vanilla HTML/JS implementation of the Studio browser UI for E2E
  tests. This file is served by the studio server from STUDIO_ASSETS_DIR and
  provides the data-testid attributes that Playwright page objects assert on.

  It intentionally avoids the React/Vite build pipeline so the Dockerfile
  does not need a node_modules install in CI — just a COPY.

  data-testid attributes consumed by Playwright page objects:
    studio-panel             — StudioPage.studioPanel (must be visible)
    app-iframe               — StudioPage.appIframe (src must contain /app/)
    cluster-status-indicator — StudioPage.clusterStatusIndicator (aria-label: "Cluster status: <status>")
    reloading-overlay        — StudioPage.reloadingOverlay (hidden by default)

  The cluster status indicator subscribes to GET /studio/cluster/events (SSE)
  and updates the aria-label when it receives a "cluster-status" named event
  with { status: "healthy" | "restarting" | "degraded" | "unknown" }.

  The app iframe loads /app/ which the studio server reverse-proxies to the
  web service (nginx in E2E tests).
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calypso Studio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #18181b; color: #f4f4f5; font-family: system-ui, sans-serif; height: 100vh; overflow: hidden; }
    #studio-panel { display: flex; height: 100vh; width: 100%; }
    #chat-side { width: 320px; flex-shrink: 0; border-right: 1px solid #3f3f46; display: flex; flex-direction: column; padding: 12px; gap: 8px; }
    #app-side { flex: 1; display: flex; flex-direction: column; }
    #app-iframe { width: 100%; flex: 1; border: none; }
    #reloading-overlay { display: none; position: absolute; inset: 0; background: rgba(24,24,27,.85); align-items: center; justify-content: center; font-size: 14px; color: #a1a1aa; }
    #reloading-overlay.visible { display: flex; }
    #cluster-status { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px; background: #fafafa; border: 1px solid #e4e4e7; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: #a1a1aa; }
    .dot.healthy    { background: #34d399; }
    .dot.restarting { background: #fbbf24; animation: pulse 1s infinite; }
    .dot.degraded   { background: #f87171; }
    .status-label { font-size: 12px; font-weight: 500; color: #52525b; }
    .status-label.healthy    { color: #047857; }
    .status-label.restarting { color: #92400e; }
    .status-label.degraded   { color: #991b1b; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }
    /* chat stub */
    #chat-input-area { display: flex; gap: 8px; }
    #chat-input { flex: 1; background: #27272a; border: 1px solid #3f3f46; border-radius: 6px; color: #f4f4f5; padding: 8px; font-size: 14px; resize: none; }
    #chat-submit { background: #3b82f6; color: #fff; border: none; border-radius: 6px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
    #chat-submit:disabled { opacity: .5; cursor: default; }
    #chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
    .msg { padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.5; word-break: break-word; }
    .msg.user { background: #3f3f46; align-self: flex-end; max-width: 85%; }
    .msg.assistant { background: #1e293b; align-self: flex-start; max-width: 100%; }
    #loading-indicator { font-size: 13px; color: #a1a1aa; display: none; }
    #loading-indicator.visible { display: block; }
    /* commit list stub */
    #commit-list { font-size: 12px; color: #a1a1aa; display: flex; flex-direction: column; gap: 4px; }
    .commit-item { display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: #27272a; border-radius: 4px; }
    .commit-hash { font-family: monospace; color: #818cf8; }
    .rollback-btn { margin-left: auto; font-size: 11px; background: #3f3f46; border: none; color: #f4f4f5; border-radius: 4px; padding: 2px 6px; cursor: pointer; }
    /* oauth stub */
    #oauth-panel { font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
    #oauth-status { color: #a1a1aa; }
    #oauth-initiate { background: #3b82f6; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
    #oauth-url-display { display: none; font-size: 12px; color: #818cf8; word-break: break-all; }
    #oauth-url-display.visible { display: block; }
    #oauth-code-input { background: #27272a; border: 1px solid #3f3f46; border-radius: 6px; color: #f4f4f5; padding: 6px; font-size: 13px; display: none; }
    #oauth-code-input.visible { display: block; }
    #oauth-submit-code { background: #3b82f6; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; display: none; }
    #oauth-submit-code.visible { display: block; }
  </style>
</head>
<body>
  <div id="studio-panel" data-testid="studio-panel">

    <!-- Left panel: chat sidebar -->
    <div id="chat-side">

      <!-- Cluster status indicator -->
      <div
        id="cluster-status-indicator"
        data-testid="cluster-status-indicator"
        aria-label="Cluster status: unknown"
      >
        <span class="dot" id="status-dot"></span>
        <span class="status-label" id="status-label">Cluster status unknown</span>
      </div>

      <!-- OAuth panel -->
      <div id="oauth-panel" data-testid="oauth-panel">
        <div id="oauth-status" data-testid="oauth-status">Disconnected</div>
        <button id="oauth-initiate" data-testid="oauth-initiate">Initiate</button>
        <div id="oauth-url-display" data-testid="oauth-url-display"></div>
        <input id="oauth-code-input" data-testid="oauth-code-input" placeholder="Enter confirmation code" />
        <button id="oauth-submit-code" data-testid="oauth-submit-code">Connect</button>
      </div>

      <!-- Chat history -->
      <div id="chat-history" data-testid="chat-history"></div>

      <!-- Loading indicator -->
      <div id="loading-indicator" data-testid="loading-indicator">Claude is thinking…</div>

      <!-- Commit list -->
      <div id="commit-list" data-testid="commit-list"></div>

      <!-- Chat input -->
      <div id="chat-input-area">
        <textarea id="chat-input" data-testid="chat-input" rows="2" placeholder="Ask Claude…"></textarea>
        <button id="chat-submit" data-testid="chat-submit">Send</button>
      </div>

    </div><!-- /chat-side -->

    <!-- Right panel: app iframe -->
    <div id="app-side">
      <iframe
        id="app-iframe"
        data-testid="app-iframe"
        src="/app/"
      ></iframe>
    </div>

  </div><!-- /studio-panel -->

  <!-- Reloading overlay (shown during hot-swaps) -->
  <div id="reloading-overlay" data-testid="reloading-overlay">Reloading…</div>

  <script type="module">
    // ── Cluster status SSE ──────────────────────────────────────────────────

    const STATUS_META = {
      healthy:    { label: 'Cluster healthy',        dotClass: 'healthy',    labelClass: 'healthy' },
      restarting: { label: 'Cluster restarting',     dotClass: 'restarting', labelClass: 'restarting' },
      degraded:   { label: 'Cluster degraded',       dotClass: 'degraded',   labelClass: 'degraded' },
      unknown:    { label: 'Cluster status unknown', dotClass: '',           labelClass: '' },
    };

    const indicator  = document.getElementById('cluster-status-indicator');
    const dot        = document.getElementById('status-dot');
    const statusLbl  = document.getElementById('status-label');

    function setClusterStatus(status) {
      const meta = STATUS_META[status] ?? STATUS_META.unknown;
      indicator.setAttribute('aria-label', `Cluster status: ${status}`);
      dot.className = `dot ${meta.dotClass}`;
      statusLbl.className = `status-label ${meta.labelClass}`;
      statusLbl.textContent = meta.label;
    }

    const es = new EventSource('/studio/cluster/events');
    es.addEventListener('cluster-status', (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.status) setClusterStatus(data.status);
      } catch { /* ignore malformed */ }
    });
    es.onerror = () => setClusterStatus('unknown');

    // ── Chat ────────────────────────────────────────────────────────────────

    const chatHistory  = document.getElementById('chat-history');
    const chatInput    = document.getElementById('chat-input');
    const chatSubmit   = document.getElementById('chat-submit');
    const loadingEl    = document.getElementById('loading-indicator');
    const commitList   = document.getElementById('commit-list');

    function appendMsg(role, text) {
      const el = document.createElement('div');
      el.className = `msg ${role}`;
      el.setAttribute('data-testid', role === 'user' ? 'message-user' : 'message-assistant');
      el.textContent = text;
      chatHistory.appendChild(el);
      chatHistory.scrollTop = chatHistory.scrollHeight;
      return el;
    }

    function refreshCommits() {
      const cookie = document.cookie;
      if (!cookie.includes('calypso_auth')) return;
      fetch('/studio/commits', { credentials: 'include' })
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (!data || !data.commits) return;
          commitList.innerHTML = '';
          data.commits.forEach(({ hash, message }) => {
            const item = document.createElement('div');
            item.className = 'commit-item';
            item.setAttribute('data-testid', 'commit-item');
            item.innerHTML = `
              <span class="commit-hash" data-testid="commit-hash">${hash.slice(0,7)}</span>
              <span data-testid="commit-message">${message}</span>
              <button class="rollback-btn" data-testid="rollback-btn" data-hash="${hash}">Rollback</button>`;
            commitList.appendChild(item);
          });
        })
        .catch(() => {});
    }

    commitList.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-testid="rollback-btn"]');
      if (!btn) return;
      fetch('/studio/rollback', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ hash: btn.dataset.hash }),
      }).then(() => refreshCommits()).catch(() => {});
    });

    async function sendMessage() {
      const msg = chatInput.value.trim();
      if (!msg) return;
      chatInput.value = '';
      chatSubmit.disabled = true;
      loadingEl.classList.add('visible');
      appendMsg('user', msg);

      try {
        const r = await fetch('/studio/chat', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg }),
        });
        const data = await r.json();
        if (data.reply) appendMsg('assistant', data.reply);
        refreshCommits();
      } catch (err) {
        appendMsg('assistant', `Error: ${err.message}`);
      } finally {
        loadingEl.classList.remove('visible');
        chatSubmit.disabled = false;
      }
    }

    chatSubmit.addEventListener('click', sendMessage);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) sendMessage();
    });

    // Auto-register a test user on first load so /studio/* routes pass auth.
    // Uses a fixed test credential — not for production use.
    (async function autoAuth() {
      const CREDS = { username: 'e2e-user', password: 'e2e-password' };
      // Try login first (user may already exist from a prior test run in same server process).
      let r = await fetch('/api/auth/login', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(CREDS),
      });
      if (!r.ok) {
        // Register then login.
        await fetch('/api/auth/register', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(CREDS),
        });
      }
      refreshCommits();
    })();

    // ── OAuth panel ─────────────────────────────────────────────────────────

    const oauthStatus    = document.getElementById('oauth-status');
    const oauthInitiate  = document.getElementById('oauth-initiate');
    const oauthUrlDisp   = document.getElementById('oauth-url-display');
    const oauthCodeInput = document.getElementById('oauth-code-input');
    const oauthSubmit    = document.getElementById('oauth-submit-code');

    oauthInitiate.addEventListener('click', async () => {
      oauthStatus.textContent = 'Pending…';
      oauthStatus.setAttribute('data-testid', 'oauth-status-pending');
      try {
        const r = await fetch('/oauth/init', { credentials: 'include' });
        const data = await r.json();
        if (data.url) {
          oauthUrlDisp.textContent = data.url;
          oauthUrlDisp.setAttribute('data-oauth-url', data.url);
          oauthUrlDisp.classList.add('visible');
          oauthCodeInput.classList.add('visible');
          oauthSubmit.classList.add('visible');
        }
      } catch (err) {
        oauthStatus.textContent = `Error: ${err.message}`;
      }
    });

    oauthSubmit.addEventListener('click', async () => {
      const code = oauthCodeInput.value.trim();
      if (!code) return;
      try {
        const r = await fetch('/oauth/complete', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        if (r.ok) {
          oauthStatus.textContent = 'Connected';
          oauthStatus.setAttribute('data-testid', 'oauth-status-connected');
          oauthCodeInput.classList.remove('visible');
          oauthSubmit.classList.remove('visible');
        }
      } catch (err) {
        oauthStatus.textContent = `Error: ${err.message}`;
      }
    });
  </script>
</body>
</html>
