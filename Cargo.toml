[workspace]
resolver = "2"
members = [
    "crates/superfield",
    "crates/sf-db",
    "crates/sf-auth",
    "crates/sharp",
    "crates/nexum",
    "crates/sf-cli",
    "crates/sf-serve",
    "crates/sf-notify",
    "crates/sf-loop",
    "crates/sf-deploy",
    "crates/fastenv",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
repository = "https://github.com/superfield-ai/monorepo"

[workspace.dependencies]
# shared crates
sf-db = { path = "crates/sf-db" }
sf-auth = { path = "crates/sf-auth" }

# component crates
sharp = { path = "crates/sharp" }
nexum = { path = "crates/nexum" }
sf-cli = { path = "crates/sf-cli" }
sf-serve = { path = "crates/sf-serve" }
sf-notify = { path = "crates/sf-notify" }
sf-loop = { path = "crates/sf-loop" }
sf-deploy = { path = "crates/sf-deploy" }
fastenv = { path = "crates/fastenv" }

# third-party deps shared across crates
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
flate2 = "1"
axum = { version = "0.8", features = ["macros", "ws"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["fs", "trace"] }
http = "1"
bincode = { version = "2", features = ["serde"] }
libc = "0.2"
