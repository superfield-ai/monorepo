services:
  # Primary (and only) Nexum database: Apache AGE on Postgres 16 (issue #99).
  #
  # Phase-1 cutover made AGE a hard runtime requirement. The
  # `apache/age:PG16_latest` image is the only Postgres service in the stack;
  # all runtime code (API, ingest, query, linker dual-write) targets it on
  # port 5432. The image bundles the AGE extension, and `db/migrations/` is
  # mounted as `/docker-entrypoint-initdb.d` so the AGE shim
  # (graph + label provisioning) is applied on first volume init.
  #
  # pgvector is layered on top via the schema migration in `db/schema.sql`
  # (CREATE EXTENSION vector); the apache/age image ships with the build
  # toolchain that lets pgvector be loaded as well.
  postgres:
    image: apache/age:PG16_latest
    environment:
      POSTGRES_DB: nexum
      POSTGRES_USER: nexum
      POSTGRES_PASSWORD: nexum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
